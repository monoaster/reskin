<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>reskin: one scene, ten skins</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0c0e2b; color: #f1eefb; font: 15px/1.4 ui-monospace, Menlo, monospace; }
  body { display: grid; place-items: center; }
  main { width: min(92vmin, 920px); }
  canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: 18px; background: #000; }
  p { margin: 10px 2px 0; display: flex; justify-content: space-between; gap: 12px; opacity: .8; }
  a { color: inherit; }
  body { place-items: start center; }
  main { width: min(96vw, 1500px); padding: 24px 0; }
  h1 { font: 900 clamp(36px, 7vw, 88px)/1 "Arial Narrow", "Helvetica Neue", sans-serif; margin: 0 0 4px; letter-spacing: -.01em; text-transform: uppercase; }
  .lede { opacity: .75; margin: 0 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  figure { margin: 0; } canvas { border-radius: 14px; }
  figcaption { margin-top: 6px; display: flex; justify-content: space-between; opacity: .85; }
</style>
<main>
<h1>One scene. Ten skins.</h1>
<p class="lede">The same 3.2 second walk, drawn by ten renderers. Each one is a single JavaScript file Claude wrote from the prompt next to it.</p>
<div class="grid" id="grid"></div>
</main>
<script>
const rig = (() => {
// reskin rig: one character, one scene, one 3.2 second walk. Every style draws from this.
//
// World: a 1000 x 1000 square, y points down, the floor is y = 800.
// The beat is 150 bpm (0.4 s). Footfalls land on the beat, the build passes on beat 7 (t = 2.8).
//
//   0.0 - 2.0   walks in from the left, slows to a stop at x = 490
//   2.0 - 2.4   raises the near hand to the laptop keyboard
//   2.4 - 2.8   types (three key taps: 2.4, 2.6, 2.8), code rows fill the screen
//   2.8         the build passes: the screen flips, confetti, a hop
//   2.8 - 3.2   fist pump, then the clip ends
//
// Everything here is a pure function of t. No randomness, no clock: call it with any t, in any order.

const W = 1000;
const H = 1000;
const FLOOR = 800;
const T = 3.2;            // seconds per style
const BPM = 150;
const BEAT = 0.4;
const SHIP_T = 2.8;       // the moment the build passes

const LAYOUT = {
  floor: FLOOR,
  desk:   { x: 560, y: 610, w: 400, h: 190 },                 // table top is y = 610
  laptop: { base: { x: 600, y: 598, w: 230, h: 12 },          // keyboard slab, sits on the desk
            screen: { x: 615, y: 440, w: 200, h: 158 } },      // facing the viewer
  hand:   { x: 650, y: 594 },                                  // where the near hand lands on the keys
  window: { x: 80, y: 130, w: 260, h: 350 },
  clock:  { x: 430, y: 170, r: 34 },
  plant:  { x: 880, y: 800 },
};

const DIMS = {
  thigh: 100, shin: 98, upperArm: 92, foreArm: 86,
  torso: 124, neck: 16, headR: 38,
  thighW: 24, shinW: 19, upperArmW: 17, foreArmW: 15, torsoW: 58, footLen: 40, footH: 14,
  depth: 26,   // z offset of the near / far limbs, for 3D styles
};

const SCREEN_LINES = [
  'const build = await ship()',
  'if (build.ok) {',
  '  deploy(build)',
  '}',
  'tests: 42 passed',
  'status: SHIPPED',
];

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, v) => { const k = clamp((v - a) / (b - a)); return k * k * (3 - 2 * k); };
const easeInOut = (k) => k * k * (3 - 2 * k);

// ---- where the body is --------------------------------------------------------------------
const X0 = -40, X1 = 490, CRUISE_END = 1.5, STOP = 2.0;
const V = (X1 - X0) / (CRUISE_END + (STOP - CRUISE_END) / 2);   // px per second while cruising

function bodyX(t) {
  if (t <= CRUISE_END) return X0 + V * Math.max(t, -1);
  if (t >= STOP) return X1;
  const u = (t - CRUISE_END) / (STOP - CRUISE_END);               // linear slow-down to a stop
  return X0 + V * CRUISE_END + V * (STOP - CRUISE_END) * (u - u * u / 2);
}

// Feet plant in world space on the beat, so nothing slides. Each foot has a 0.8 s cycle:
// 0 - 0.6 planted, 0.6 - 1 swinging to the next planting spot, which is under the pelvis at mid-stance.
function footTrack(t, offset, side) {
  const P = 0.8, STANCE = 0.6;
  const n = Math.floor((t - offset) / P);
  const u = (t - offset) / P - n;
  const land = (k) => bodyX(offset + k * P + 0.24) + side * 6;
  const L0 = land(n), L1 = land(n + 1);
  if (u < STANCE) return { x: L0, lift: 0, swing: -1, u };
  const s = (u - STANCE) / (1 - STANCE);
  return { x: lerp(L0, L1, easeInOut(s)), lift: Math.sin(Math.PI * s), swing: s, u };
}

function ik2(ax, ay, tx, ty, l1, l2, sgn) {
  let dx = tx - ax, dy = ty - ay;
  let d = Math.hypot(dx, dy);
  const max = l1 + l2 - 0.5;
  if (d > max) { tx = ax + dx * max / d; ty = ay + dy * max / d; dx = tx - ax; dy = ty - ay; d = max; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = ax + a * dx / d, my = ay + a * dy / d;
  return { x: mx + sgn * h * (-dy / d), y: my + sgn * h * (dx / d), tx, ty };
}

// ---- the pose -----------------------------------------------------------------------------
// Returns joints as {x, y, z}. z is -1 (far side), 0 (spine) or +1 (near side) so 3D styles can push limbs apart.
function pose(t) {
  t = clamp(t, 0, T);
  const D = DIMS;
  const walk = 1 - smooth(1.55, 2.05, t);             // 1 while walking, 0 once stopped
  const reach = smooth(2.0, 2.45, t);                 // near hand goes to the keyboard
  const celebrate = smooth(2.82, 3.0, t);             // fist pump
  const tapPulse = (t0) => { const k = (t - t0) / 0.12; return k > 0 && k < 1 ? Math.sin(Math.PI * k) : 0; };
  const tap = Math.max(tapPulse(2.4), tapPulse(2.6), tapPulse(2.8));
  const hopK = clamp((t - 2.84) / 0.34);
  const hop = 34 * Math.sin(Math.PI * hopK);

  const px = bodyX(t) + 0;
  const bob = walk * 7 * (0.5 + 0.5 * Math.cos(2 * Math.PI * t / BEAT));
  const standH = 196;
  const py = FLOOR - standH + bob - hop;
  const lean = 0.05 * walk + 0.16 * reach * (1 - celebrate * 0.7) - 0.04 * celebrate;

  const sx = px + Math.sin(lean) * D.torso * 0.96;
  const sy = py - Math.cos(lean) * D.torso * 0.96;
  const neck = { x: px + Math.sin(lean) * D.torso, y: py - Math.cos(lean) * D.torso, z: 0 };
  const headTilt = lean + 0.1 * reach - 0.1 * celebrate;
  const head = { x: neck.x + Math.sin(headTilt) * (D.neck + D.headR), y: neck.y - Math.cos(headTilt) * (D.neck + D.headR), z: 0, r: D.headR, angle: headTilt };

  // legs
  const fN = footTrack(t, 0.0, +1);       // near foot lands on t = 0, 0.8, 1.6 ...
  const fF = footTrack(t, 0.4, -1);       // far foot lands on t = 0.4, 1.2, 2.0 ...
  const settle = 1 - walk;
  const stand = (side) => px + side * 16;
  const legJoints = (f, side, z) => {
    const fx = lerp(f.x, stand(side) + 0, settle);
    const lift = f.lift * 46 * walk + hop * 0.9;
    const ay = FLOOR - 12 - lift;
    const hip = { x: px + side * 4, y: py, z };
    const k = ik2(hip.x, hip.y, fx, ay, D.thigh, D.shin, -1);
    const pitch = f.swing < 0 ? 0 : lerp(0.55, -0.3, f.swing);
    const pitchAir = hop > 2 ? 0.25 : pitch;
    const toe = { x: k.tx + Math.cos(pitchAir) * D.footLen, y: k.ty + 12 + Math.sin(pitchAir) * D.footLen * 0.6 - (hop > 2 ? 0 : 0), z };
    if (f.swing < 0 && hop < 2) toe.y = FLOOR;
    return { hip, knee: { x: k.x, y: k.y, z }, ankle: { x: k.tx, y: k.ty, z }, toe };
  };
  const legN = legJoints(fN, +1, +1);
  const legF = legJoints(fF, -1, -1);

  // arms
  const swingA = 0.62 * walk;
  const thN = -swingA * Math.cos(2 * Math.PI * t / (BEAT * 2));
  const thF = +swingA * Math.cos(2 * Math.PI * t / (BEAT * 2));
  const armLen = 150;
  const shoulderN = { x: sx + 3, y: sy, z: +1 }, shoulderF = { x: sx - 3, y: sy, z: -1 };
  const hangN = { x: shoulderN.x + Math.sin(thN + 0.05) * armLen, y: shoulderN.y + Math.cos(thN + 0.05) * armLen };
  const hangF = { x: shoulderF.x + Math.sin(thF + 0.05) * armLen, y: shoulderF.y + Math.cos(thF + 0.05) * armLen };
  const keys = { x: LAYOUT.hand.x, y: LAYOUT.hand.y - tap * 9 };
  const up = { x: shoulderN.x + 52, y: shoulderN.y - 150 - Math.sin(t * 40) * 3 * celebrate };
  let tgtN = { x: lerp(hangN.x, keys.x, reach), y: lerp(hangN.y, keys.y, reach) };
  tgtN = { x: lerp(tgtN.x, up.x, celebrate), y: lerp(tgtN.y, up.y, celebrate) };
  const tgtF = { x: hangF.x + (hop > 0 ? -18 : 0), y: hangF.y - hop * 0.4 };
  const aN = ik2(shoulderN.x, shoulderN.y, tgtN.x, tgtN.y, D.upperArm, D.foreArm, +1);
  const aF = ik2(shoulderF.x, shoulderF.y, tgtF.x, tgtF.y, D.upperArm, D.foreArm, +1);

  return {
    t, walk, reach, celebrate, tap, hop, lean, facing: 1,
    pelvis: { x: px, y: py, z: 0 }, chest: { x: lerp(px, sx, 0.55), y: lerp(py, sy, 0.55), z: 0 }, neck, head,
    near: { hip: legN.hip, knee: legN.knee, ankle: legN.ankle, toe: legN.toe, shoulder: shoulderN, elbow: { x: aN.x, y: aN.y, z: +1 }, hand: { x: aN.tx, y: aN.ty, z: +1 } },
    far:  { hip: legF.hip, knee: legF.knee, ankle: legF.ankle, toe: legF.toe, shoulder: shoulderF, elbow: { x: aF.x, y: aF.y, z: -1 }, hand: { x: aF.tx, y: aF.ty, z: -1 } },
  };
}

// ---- the story around the body -----------------------------------------------------------------
// screen.awake: laptop wakes while the hand lifts. screen.typed: 0..1 of the code on screen.
// screen.ship: 0 -> 1 across the flip to the green "SHIPPED" state. shipAge: seconds since it passed (or -1).
function story(t) {
  const typed = smooth(2.38, 2.8, t);
  const ship = smooth(SHIP_T, SHIP_T + 0.12, t);
  const awake = smooth(1.7, 2.0, t);
  const rows = [0.55, 0.8, 0.45, 0.2, 0.7, 0.35].map((w, i) => ({
    w, indent: [0, 0, 0.12, 0, 0, 0.12][i],
    len: clamp(typed * 6.4 - i, 0, 1),
  }));
  const chars = SCREEN_LINES.map((s, i) => s.slice(0, Math.round(s.length * clamp(typed * 6.4 - i, 0, 1))));
  return { t, screen: { awake, typed, ship, rows, chars }, shipAge: t >= SHIP_T ? t - SHIP_T : -1 };
}

// Confetti: deterministic bits that fly up from the top of the laptop on the beat the build passes.
function particles(t, n = 28) {
  const age = t - SHIP_T;
  if (age < 0 || age > 1.5) return [];
  const out = [];
  let s = 1234567;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 0; i < n; i++) {
    const vx = (rnd() - 0.5) * 520, vy = -(220 + rnd() * 330), w = (rnd() - 0.5) * 14;
    const size = 8 + rnd() * 10, kind = Math.floor(rnd() * 4);
    out.push({
      x: LAYOUT.laptop.screen.x + LAYOUT.laptop.screen.w / 2 + vx * age,
      y: LAYOUT.laptop.screen.y + vy * age + 520 * age * age,
      rot: w * age, size, kind, alpha: 1 - smooth(1.0, 1.5, age), i,
    });
  }
  return out;
}

// For styles that want to draw limbs as two-bone chains: [[from, to, width], ...] far side first.
function limbs(p) {
  const D = DIMS;
  const L = (a, b, w) => [a, b, w];
  const leg = (s) => [L(s.hip, s.knee, D.thighW), L(s.knee, s.ankle, D.shinW), L(s.ankle, s.toe, D.footH)];
  const arm = (s) => [L(s.shoulder, s.elbow, D.upperArmW), L(s.elbow, s.hand, D.foreArmW)];
  return { farLeg: leg(p.far), farArm: arm(p.far), torso: L(p.pelvis, p.neck, D.torsoW), nearLeg: leg(p.near), nearArm: arm(p.near) };
}

// Shared helpers for style code.
const util = { clamp, lerp, smooth, easeInOut };
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

return { W, H, FLOOR, T, BPM, BEAT, SHIP_T, LAYOUT, DIMS, SCREEN_LINES, bodyX, pose, story, particles, limbs, util, rng };
})();
const styles = [
(() => {
// 00 skeleton: the plainest possible renderer. It exists to show the rig contract and to be the file every
// other style starts from. A style is one function: render(ctx, t, w, h) draws frame t (seconds) on a w x w canvas.
const { W, H, LAYOUT, DIMS, pose, story, particles, limbs, util } = rig;

const meta = { id: '00', slug: 'skeleton', name: 'Skeleton', tag: 'the rig', accent: '#9ad1ff' };

function render(ctx, t, w, h) {
  const k = w / W;
  ctx.save();
  ctx.scale(k, k);
  ctx.fillStyle = '#10131c'; ctx.fillRect(0, 0, W, H);
  // floor
  ctx.fillStyle = '#1b2030'; ctx.fillRect(0, LAYOUT.floor, W, H - LAYOUT.floor);
  // window + clock
  const wn = LAYOUT.window; ctx.strokeStyle = '#3a4260'; ctx.lineWidth = 4; ctx.strokeRect(wn.x, wn.y, wn.w, wn.h);
  ctx.beginPath(); ctx.arc(LAYOUT.clock.x, LAYOUT.clock.y, LAYOUT.clock.r, 0, 7); ctx.stroke();
  // desk
  const d = LAYOUT.desk; ctx.fillStyle = '#2a3150'; ctx.fillRect(d.x, d.y, d.w, 16); ctx.fillRect(d.x + 14, d.y, 14, d.h); ctx.fillRect(d.x + d.w - 28, d.y, 14, d.h);
  // laptop
  const s = story(t), L = LAYOUT.laptop;
  ctx.fillStyle = '#c9ced8'; ctx.fillRect(L.base.x, L.base.y, L.base.w, L.base.h);
  const ship = s.screen.ship;
  ctx.fillStyle = ship > 0.5 ? '#1fb36b' : `rgba(120,160,255,${0.15 + 0.5 * s.screen.awake})`;
  ctx.fillRect(L.screen.x, L.screen.y, L.screen.w, L.screen.h);
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  s.screen.rows.forEach((r, i) => ctx.fillRect(L.screen.x + 14 + r.indent * 160, L.screen.y + 16 + i * 22, r.w * 170 * r.len, 10));
  // figure
  const p = pose(t), lb = limbs(p);
  const draw = (list, col) => { ctx.strokeStyle = col; ctx.lineCap = 'round'; for (const [a, b, wd] of list) { ctx.lineWidth = wd; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } };
  draw(lb.farLeg, '#6b7bb0'); draw(lb.farArm, '#6b7bb0');
  draw([lb.torso], '#ff8fa3');
  draw(lb.nearLeg, '#9ad1ff'); draw(lb.nearArm, '#ffd27a');
  ctx.fillStyle = '#ffd9b8'; ctx.beginPath(); ctx.arc(p.head.x, p.head.y, p.head.r, 0, 7); ctx.fill();
  for (const q of particles(t)) { ctx.globalAlpha = q.alpha; ctx.fillStyle = ['#ff6b6b', '#ffd23f', '#6bd6ff', '#9bff7a'][q.kind]; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
  ctx.globalAlpha = 1;
  ctx.restore();
}

return { meta, render };
})(),
(() => {
// 01 pixel: a true 128x128 pixel-art render. Everything is written into a 128x128 array of palette indices
// (16 fixed colours), turned into an ImageData, then scaled up to w x w with nearest neighbour. No anti-aliasing.
const { W, H, LAYOUT, DIMS, pose, story, particles, util, rng } = rig;

const meta = { id: '01', slug: 'pixel', name: 'Pixel Art', tag: '8-bit', accent: '#ff3c9e' };

const N = 128;
const S = W / N; // world units per low-res pixel (7.8125)

// ---- the 16 colours ---------------------------------------------------------------------------------
const PAL = [
  '#120d24', // 0 ink
  '#2a1d4e', // 1 wall dark / hair of the night
  '#44347a', // 2 wall light
  '#6b55b0', // 3 lavender (horizon, far shoe, shade)
  '#ff3c9e', // 4 hot pink (hoodie)
  '#a8185f', // 5 dark pink
  '#ffd23f', // 6 yellow
  '#fff4d6', // 7 cream
  '#3fe0ff', // 8 cyan
  '#1c8fd0', // 9 jeans blue
  '#1a4a8a', // 10 deep blue
  '#3ddc84', // 11 green
  '#1c7a4a', // 12 dark green
  '#8a5a3c', // 13 wood
  '#4f321f', // 14 dark wood / hair
  '#f2a07b', // 15 skin
];
const INK = 0, WALL = 1, WALL2 = 2, LAV = 3, PINK = 4, PINKD = 5, YEL = 6, CREAM = 7, CYAN = 8, BLUE = 9, BLUED = 10,
  GRN = 11, GRND = 12, WOOD = 13, WOODD = 14, SKIN = 15;
const LUT = new Uint32Array(16);
PAL.forEach((h, i) => { const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16); LUT[i] = (255 << 24) | (b << 16) | (g << 8) | r; });

const FY = 101; // first floor row

// ---- low-res target (module-level caches; fully repainted on every call) ---------------------------------
const buf = new Uint8Array(N * N);
const mo = new Uint8Array(N * N), mf = new Uint8Array(N * N);
let low = null, lctx = null, img = null, img32 = null;
function target() {
  if (!low) {
    low = typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(N, N) : Object.assign(document.createElement('canvas'), { width: N, height: N });
    lctx = low.getContext('2d'); lctx.imageSmoothingEnabled = false;
    img = lctx.createImageData(N, N); img32 = new Uint32Array(img.data.buffer);
  }
}

// ---- primitives -------------------------------------------------------------------------------------
const pix = (x, y, c) => { if (x >= 0 && x < N && y >= 0 && y < N) buf[y * N + x] = c; };
const get = (x, y) => (x >= 0 && x < N && y >= 0 && y < N ? buf[y * N + x] : -1);
const rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) pix(x + i, y + j, c); };
const disc = (cx, cy, r2, c) => { const r = Math.ceil(Math.sqrt(r2)); for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r2) pix(cx + i, cy + j, c); };
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bayer = (x, y) => (B4[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
const dith = (x, y, level) => level > bayer(x, y);

// Bresenham, calling fn(x, y) on every step (end points included).
function line(x0, y0, x1, y1, fn) {
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;) {
    fn(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
// Round brushes of d pixels across, as lists of offsets.
const BR = [];
for (let d = 1; d <= 9; d++) {
  const o = d % 2 ? 0 : 0.5, lo = -Math.floor(d / 2), hi = lo + d - 1, r = d / 2, a = [];
  for (let j = lo; j <= hi; j++) for (let i = lo; i <= hi; i++) if ((i + o) * (i + o) + (j + o) * (j + o) <= r * r + 0.7) a.push([i, j]);
  BR[d] = a;
}
function stamp(mask, ax, ay, bx, by, d) {
  const br = BR[d];
  line(ax, ay, bx, by, (x, y) => { for (const [dx, dy] of br) { const xx = x + dx, yy = y + dy; if (xx >= 0 && xx < N && yy >= 0 && yy < N) mask[yy * N + xx] = 1; } });
}
// One sprite part: segments [ax, ay, bx, by, width] drawn as thick Bresenham lines with a 1 px ink outline.
function part(segs, fillFn) {
  mo.fill(0); mf.fill(0);
  for (const s of segs) { stamp(mo, s[0], s[1], s[2], s[3], s[4] + 2); stamp(mf, s[0], s[1], s[2], s[3], s[4]); }
  for (let i = 0; i < N * N; i++) if (mo[i]) buf[i] = INK;
  for (let i = 0; i < N * N; i++) if (mf[i]) buf[i] = fillFn(i % N, (i / N) | 0);
}

// ---- 3x5 pixel font ---------------------------------------------------------------------------------
const GLYPH_SRC = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010',
  K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010',
  P: '110101110100100', Q: '010101101111011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
  Z: '111001010100111', 0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',

{ const r = rng(321); const cols = [CYAN, PINK, YEL, CREAM, GRN];

function drawFloor() {

}

function drawPlant(t, s) {
  const bx = 113, by = 96;

  // five leaves fanning out of the pot: tapering Bresenham curves with an ink outline, dark body, light mid-rib
  const leaves = [[-6, -17, -10], [-3, -28, -6], [3, -32, 1], [8, -26, 9], [10, -15, 13]];

function drawLaptop(t, s) {

function drawFootDust(t) {

// ---- the character ----------------------------------------------------------------------------------
function drawChar(t, p, s) {
  const happy = s.shipAge >= 0;
  const J = (j) => P(j);
  const leg = (side, jeans, shoeCol) => {
    const hip = J(side.hip), kn = J(side.knee), an = J(side.ankle), to = J(side.toe);
    part([[hip[0], hip[1], kn[0], kn[1], 4], [kn[0], kn[1], an[0], an[1], 3]], () => jeans);
    // sneaker: foot line with a lavender sole
    part([[an[0], an[1] + 1, to[0], to[1] - 1, 3]], (x, y) => (y >= Math.max(an[1] + 1, to[1] - 1) + 1 ? LAV : shoeCol));
    pix(an[0] - 1, an[1] + 1, PINK); // heel tab
  };
  const arm = (side, col, dark) => {
    const sh = J(side.shoulder), el = J(side.elbow), ha = J(side.hand);
    part([[sh[0], sh[1], el[0], el[1], 3], [el[0], el[1], ha[0], ha[1], 3]], (x, y) => col);
    return ha;
  };
  const hand = (ha, fist) => { part([[ha[0], ha[1], ha[0], ha[1], fist ? 3 : 3]], () => SKIN); if (fist) { pix(ha[0] - 1, ha[1], 15); } };

  // far side first
  leg(p.far, BLUED, LAV);
  const hF = arm(p.far, PINKD); hand(hF, false);

  // torso: hoodie
  const pel = J(p.pelvis), nk = J(p.neck);
  const ts = [pel[0] + (nk[0] - pel[0]) * 0.2, pel[1] + (nk[1] - pel[1]) * 0.2].map(Math.round);
  const te = [nk[0], nk[1] + 1];
  const axis = (y) => pel[0] + (nk[0] - pel[0]) * (pel[1] - y) / Math.max(1, pel[1] - nk[1]);
  part([[ts[0], ts[1], te[0], te[1], 7]], (x, y) => {
    const a = axis(y);
    if (y >= pel[1] - 1) return PINKD;                   // ribbed hem
    if (x < a - 1.4) return PINKD;                       // back shade
    return PINK;
  });
  // pocket
  const pa = axis(pel[1] - 5);
  line(Math.round(pa - 1), pel[1] - 5, Math.round(pa + 3), pel[1] - 5, (x, y) => pix(x, y, PINKD));
  pix(Math.round(pa + 3), pel[1] - 4, PINKD); pix(Math.round(pa - 1), pel[1] - 4, PINKD);
  // hood behind the head + drawstrings
  disc(nk[0] - 2, nk[1], 10, INK); disc(nk[0] - 2, nk[1], 5, PINKD);
  pix(nk[0] + 1, nk[1] + 3, CREAM); pix(nk[0] + 1, nk[1] + 4, CREAM); pix(nk[0] + 3, nk[1] + 3, CREAM); pix(nk[0] + 3, nk[1] + 4, CREAM);

  // head
  const [hx, hy] = J(p.head), a = p.head.angle, ca = Math.cos(a), sa = Math.sin(a);
  disc(hx, hy, 33, INK);
  const local = (x, y) => { const dx = x - hx, dy = y - hy; return [dx * ca + dy * sa, -(dx * sa - dy * ca)]; }; // u right, v down
  for (let y = hy - 6; y <= hy + 6; y++) for (let x = hx - 6; x <= hx + 6; x++) {
    const dx = x - hx, dy = y - hy; if (dx * dx + dy * dy > 21) continue;
    const [u, v] = local(x, y);
    let c = SKIN;
    if (v < -1.8 || (u < -1.2 && v < 2.2) || (v < -0.8 && u < 1.2)) c = WOODD;      // short hair: top, back, a fringe
    if (c === WOODD && v < -3.2 && u > -1) c = WOOD;                                  // hair highlight
    if (c === SKIN && u < -2.2 && v > 2.2) c = PINKD;                                 // hood rim at the jaw
    pix(x, y, c);
  }
  const ep = (u, v) => { const x = Math.round(hx + u * ca - v * sa), y = Math.round(hy + u * sa + v * ca); return [x, y]; };
  const [e1x, e1y] = ep(1.2, 0.8), [e2x, e2y] = ep(3.4, 0.8);
  if (happy) { // eyes closed with joy, a open grin
    pix(e1x, e1y, INK); pix(e2x, e2y, INK); pix(e1x - 1, e1y + 1, INK); pix(e2x + 1, e2y + 1, INK);
    const [m1x, m1y] = ep(2.0, 3.0); rect(m1x, m1y, 3, 1, INK); pix(m1x + 1, m1y + 1, PINK);
    const [c1x, c1y] = ep(0.2, 2.2); pix(c1x, c1y, PINK);

    pix(e1x, e1y, INK); pix(e1x, e1y - 1, INK); pix(e2x, e2y, INK); pix(e2x, e2y - 1, INK);
    const [m1x, m1y] = ep(2.6, 3.0); pix(m1x, m1y, PINKD);
  }

  const bx = nk[0], by = nk[1] + 3;
  line(bx - 4, by, bx - 2, by + 2, (x, y) => pix(x, y, YEL)); line(bx - 2, by + 2, bx + 2, by + 2, (x, y) => pix(x, y, YEL)); line(bx + 2, by + 2, bx + 4, by, (x, y) => pix(x, y, YEL));
  line(bx - 3, by + 3, bx + 3, by + 3, (x, y) => pix(x, y, INK));

  // near side
  leg(p.near, BLUE, CREAM);
  const hN = arm(p.near, PINK);
  hand(hN, p.celebrate > 0.5);
  // keys: a skin highlight and cuff
  if (p.celebrate > 0.5) { // action lines above the fist
    const f = Math.floor(t * 15) % 2;
    for (const dx of [-3, 0, 3]) { rect(hN[0] + dx, hN[1] - 5 - f * (dx === 0 ? 1 : 0), 1, 2, YEL); }
  }
  return { hN };
}

// ---- main ---------------------------------------------------------------------------------------------
function render(ctx, t, w, h) {

  const p = pose(t), s = story(t);
  drawWall();
  drawWindow(t, s);
  drawClock(t);
  drawFloor();
  drawDeskShadows();
  drawDesk();
  drawLaptop(t, s);
  drawPlant(t, s);

  // rays burst from the laptop at the moment of shipping
  const age = s.shipAge;
  if (age >= 0 && age < 0.3) {

    for (let i = 0; i < 14; i++) {

      line(Math.round(cx + Math.cos(a) * r1), Math.round(cy + Math.sin(a) * r1), Math.round(cx + Math.cos(a) * r2), Math.round(cy + Math.sin(a) * r2), (x, y) => { if (get(x, y) !== INK) pix(x, y, i % 2 ? YEL : CREAM); });
    }

  cmds.push(hand(312 + t * 5, 23, 4, C.orange, 0.95 * ca));
  cmds.push(hand(t * 200, 27, 2.5, C.mag, 0.9 * ca));

  // sign (mounted over the desk): outline plus letters. Dark glass until the build passes.
  const sg = aux.sign, border = [[sg.x, sg.y], [sg.x + sg.w, sg.y], [sg.x + sg.w, sg.y + sg.h], [sg.x, sg.y + sg.h]];
  const bl = age < 0 ? 0 : signLevel(age, 8);
  const sOn = (lvl, col, o) => (lvl > 0.02 ? tube(o.pts, col, { ...o, a: lvl }) : tube(o.pts, col, { ...o, off: true }));
  cmds.push(sOn(bl, C.cyan, { pts: border, closed: true, cr: 16, wd: 5, glow: 0.8 }));
  const wd = word('SHIPPED', sg.x + (sg.w - aux.wordW) / 2, sg.y + 26, 72, 18);
  for (const lt of wd.letters) {
    const lvl = signLevel(age, lt.i);
    lt.strokes.forEach((s, j) => cmds.push(sOn(lvl, C.mag, { pts: s, closed: lt.closed, cr: 10, wd: 7, caps: lt.caps[j] || undefined, capS: 0.62 })));
  }

  // desk
  const d = L.desk, dc = C.violet, da = g.desk;
  cmds.push(tube([[d.x, d.y + 7], [d.x + d.w, d.y + 7]], dc, { a: da, caps: 'both' }));
  cmds.push(tube([[d.x + 21, d.y + 22], [d.x + 21, L.floor - 4]], dc, { a: da, caps: 'end' }));
  cmds.push(tube([[d.x + d.w - 21, d.y + 22], [d.x + d.w - 21, L.floor - 4]], dc, { a: da, caps: 'end' }));
  cmds.push(tube([[d.x + 21, d.y + 100], [d.x + d.w - 21, d.y + 100]], dc, { wd: 5, a: 0.7 * da, ns: true }));
  cmds.push(tube([[d.x + 130, d.y + 28], [d.x + 290, d.y + 28], [d.x + 290, d.y + 78], [d.x + 130, d.y + 78]], dc, { closed: true, cr: 8, wd: 5, a: 0.75 * da }));
  cmds.push(tube([[d.x + 200, d.y + 48], [d.x + 220, d.y + 48]], dc, { wd: 5, a: 0.8 * da, ns: true }));

  // laptop: frame, screen glow, code rows, base. Cyan-white, then green on the ship beat.
  const lp = L.laptop, sc = lp.screen, pulse = Math.exp(-Math.max(age, 0) * 7) * (age >= 0 ? 1 : 0);
  const lcol = mixc(C.ice, C.green, ship), lg = (0.55 + 0.45 * st.screen.awake) * (1 + 0.5 * pulse);
  cmds.push({ t: 'fill', rect: [sc.x + 6, sc.y + 6, sc.w - 12, sc.h - 12], col: mixc(C.blue, C.green, ship), a: (0.1 + 0.28 * st.screen.awake) * (1 - ship) + ship * (0.5 + 0.3 * pulse) + 0.1 * p.tap });
  cmds.push(tube([[sc.x, sc.y], [sc.x + sc.w, sc.y], [sc.x + sc.w, sc.y + sc.h], [sc.x, sc.y + sc.h]], lcol, { closed: true, cr: 9, a: lg }));
  cmds.push(tube([[lp.base.x - 4, lp.base.y + 8], [lp.base.x + lp.base.w + 8, lp.base.y + 8]], lcol, { wd: 6, a: lg, caps: 'both', capS: 0.7 }));
  const rc = [C.cyan, C.mag, C.amber, C.cyan, C.violet, C.mag];
  st.screen.rows.forEach((rw, i) => {
    if (rw.len < 0.04) return;
    const x0 = sc.x + 20 + rw.indent * 150, y0 = sc.y + 26 + i * 21;
    cmds.push(tube([[x0, y0], [x0 + Math.max(2, rw.w * 150 * rw.len), y0]], rc[i], { wd: 5, a: (1 - ship) * 0.95 * lg, ns: true }));
  });
  if (ship > 0.02) {
    const cx = sc.x + sc.w / 2, cy = sc.y + 42;
    cmds.push(tube([[cx - 22, cy + 2], [cx - 7, cy + 18], [cx + 24, cy - 20]], C.green, { wd: 8, a: ship, cr: 4, glow: 1.2 }));
    const w2 = word('SHIPPED', 0, 0, 24, 10), ox = cx - w2.width / 2, oy = sc.y + 92;
    const w3 = word('SHIPPED', ox, oy, 24, 10);
    for (const lt of w3.letters) for (const s of lt.strokes) cmds.push(tube(s, C.green, { closed: lt.closed, cr: 4, wd: 4, a: ship, ns: true }));
  }

  // plant, in front of the desk
  const pl = L.plant, sway = (i) => Math.sin(t * 1.7 + i * 1.3) * 1.8 + (age >= 0 ? 6 * Math.exp(-age * 6) * Math.sin(age * 38 + i) : 0);
  const pa = g.plant;
  const pot = [[pl.x - 36, pl.y - 58], [pl.x + 36, pl.y - 58], [pl.x + 27, pl.y], [pl.x - 27, pl.y]];
  cmds.push(erase(pot, { cr: 6, pad: 8 }));
  cmds.push(tube(pot, C.orange, { closed: true, cr: 7, a: pa }));
  cmds.push(tube([[pl.x - 44, pl.y - 68], [pl.x + 44, pl.y - 68]], C.orange, { a: pa, caps: 'both', capS: 0.7 }));
  const ang = [-72, -47, -22, 3, 28, 50, 72], len = [105, 150, 185, 205, 178, 142, 104];
  ang.forEach((aa, i) => {
    const th = (aa + sway(i)) * Math.PI / 180, dx = Math.sin(th), dy = -Math.cos(th), nx = -dy, ny = dx, L0 = len[i], bx = pl.x, by = pl.y - 70;
    const at = (s, q) => [bx + dx * s + nx * q, by + dy * s + ny * q, 0], w = L0 * 0.13;
    const leaf = [at(L0 * 0.34, 0), at(L0 * 0.52, w), at(L0 * 0.78, w * 0.85), at(L0, 0), at(L0 * 0.78, -w * 0.85), at(L0 * 0.52, -w)];
    cmds.push(erase(leaf, { smooth: true, pad: 8 }));
    cmds.push(tube([at(0, 0), at(L0 * 0.34, 0)], C.lime, { wd: 4, a: 0.6 * pa, ns: true }));
    cmds.push(tube(leaf, C.lime, { closed: true, smooth: true, a: 0.7 * pa, glow: 0.5 }));
  });
}

function buildFigure(t, p, st, cmds, shade, aux) {
  const ship = st.screen.ship, cel = p.celebrate, sm = Math.max(cel, ship);
  const fg = flick(t, 5, 20, 0.02, 0.15);
  const f = (x, y) => [x, y];
  const addLeg = (s, near) => {
    const dim = near ? 1 : 0.5;
    const chain = [f(s.hip.x, s.hip.y), f(s.knee.x, s.knee.y), f(s.ankle.x, s.ankle.y)];
    const jeans = limb(chain, [13, 10.5, 9], { t0: 18, t1: 17 });
    const ex = Math.atan2(s.toe.y - s.ankle.y - 12, s.toe.x - s.ankle.x), fx = [Math.cos(ex), Math.sin(ex)], ux = [fx[1], -fx[0]];
    const sp = (a, b, r = 6) => [s.toe.x + fx[0] * a + ux[0] * b, s.toe.y + fx[1] * a + ux[1] * b, r];
    const shoe = [sp(-50, 0, 5), sp(-53, 17, 6), sp(-48, 31, 8), sp(-30, 32, 8), sp(-23, 21, 7), sp(-8, 16, 7), sp(8, 10, 6), sp(7, 0, 5)];
    if (near) { cmds.push(erase(jeans, { closed: true, cr: 6, pad: 6 })); cmds.push(erase(shoe, { closed: true, pad: 6 })); shade.push(jeans, shoe); }
    cmds.push(tube(jeans, C.cyan, { cr: 26, a: dim * fg }));
    cmds.push(tube(shoe, C.orange, { closed: true, a: dim * fg }));
    cmds.push(tube([sp(-26, 24, 0), sp(-14, 17, 0)], C.white, { wd: 3, ns: true, a: 0.7 * dim * fg }));
  };
  const addArm = (s, near) => {
    const dim = near ? 1 : 0.5;
    const chain = [f(s.shoulder.x, s.shoulder.y), f(s.elbow.x, s.elbow.y), f(s.hand.x, s.hand.y)];
    const sleeve = limb(chain, [10.5, 9, 7.5], { t0: 2, t1: 9, c0: true, r: 22 });
    if (near) { cmds.push(erase(sleeve, { closed: true, pad: 7, cr: 6 })); shade.push(sleeve); }
    cmds.push(tube(sleeve, C.mag, { closed: true, cr: 22, a: dim * fg }));
    const dx = s.hand.x - s.elbow.x, dy = s.hand.y - s.elbow.y, dl = Math.hypot(dx, dy) || 1;
    const hx = s.hand.x + dx / dl * 9, hy = s.hand.y + dy / dl * 9, hr = cel > 0.5 && near ? 11 : 9;
    const hp = []; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; hp.push([hx + Math.cos(a) * hr, hy + Math.sin(a) * hr, 0]); }
    if (near) cmds.push(erase(hp, { closed: true, pad: 4 }));
    cmds.push(tube(hp, C.cyan, { closed: true, wd: 6, a: dim * fg }));
  };
  addLeg(p.far, false);
  addArm(p.far, false);

  // hoodie
  const a0 = [p.neck.x - p.pelvis.x, p.neck.y - p.pelvis.y], al = Math.hypot(a0[0], a0[1]) || 1, a = [a0[0] / al, a0[1] / al], fw = [-a[1], a[0]];
  const T = (s, q, r = 10) => [p.pelvis.x + a[0] * s + fw[0] * q, p.pelvis.y + a[1] * s + fw[1] * q, r];
  const body = [T(-12, -27), T(30, -31), T(84, -30), T(112, -28), T(al - 3, -15, 6), T(al - 1, 13, 6), T(112, 27), T(84, 31), T(30, 30), T(-12, 28)];
  cmds.push(erase(body, { closed: true, pad: 6 })); shade.push(body);
  cmds.push(tube([T(al - 6, -15, 0), T(al + 8, -28, 0), T(al - 14, -41, 0), T(al - 40, -36, 0)], C.mag, { smooth: true, wd: 5, a: 0.8 * fg, glow: 0.7 }));
  cmds.push(tube(body, C.mag, { closed: true, a: fg }));
  const sw = (i) => Math.sin(t * 9 + i * 2) * 4 * p.walk + (p.hop > 1 ? 5 : 0);
  cmds.push(tube([T(al - 6, 10, 0), T(al - 30, 14 + sw(0), 0), T(al - 52, 15 + sw(0) * 1.6, 0)], C.mag, { wd: 4, a: 0.9 * fg, caps: 'end', capS: 0.5, smooth: true, glow: 0.7 }));

  // headphones around the neck: a band that runs under the chin and behind the neck, a near cup on the chest, a far cup behind
  const N = (s, q, r = 0) => [p.neck.x + a[0] * s + fw[0] * q, p.neck.y + a[1] * s + fw[1] * q, r];
  const fcup = [N(-14, -30, 6), N(-14, -46, 6), N(-42, -46, 6), N(-42, -30, 6)];
  cmds.push(tube(fcup, C.amber, { closed: true, wd: 5, a: 0.5 * fg, glow: 0.6 }));
  cmds.push(tube([N(-26, 33), N(-10, 20), N(-4, 0), N(-8, -20), N(-14, -30)], C.amber, { smooth: true, a: fg, glow: 0.8 }));
  const cup = [N(-14, 24, 8), N(-14, 44, 8), N(-48, 44, 8), N(-48, 24, 8)];
  cmds.push(erase(cup, { closed: true, pad: 5 })); shade.push(cup);
  cmds.push(tube(cup, C.amber, { closed: true, a: fg, glow: 0.8 }));

  // near leg over the hoodie hem
  addLeg(p.near, true);

  // head
  const hd = p.head, ang = hd.angle, fh = [Math.cos(ang), Math.sin(ang)], dh = [-Math.sin(ang), Math.cos(ang)];
  const hl = (x, y, r = 0) => [hd.x + fh[0] * x + dh[0] * y, hd.y + fh[1] * x + dh[1] * y, r];
  const skull = [], nHead = 56;
  for (let i = 0; i <= nHead; i++) {
    const ph = lerp(130, 455, i / nHead), q = ph * Math.PI / 180;
    const dn = ((ph % 360) - 354) / 7, rr = hd.r + 8 * Math.exp(-dn * dn);
    skull.push(hl(Math.cos(q) * rr, Math.sin(q) * rr));
  }
  const disc = []; for (let i = 0; i < 24; i++) { const q = i / 24 * Math.PI * 2; disc.push(hl(Math.cos(q) * (hd.r - 1), Math.sin(q) * (hd.r - 1))); }
  cmds.push(erase(disc, { closed: true, pad: 8 })); shade.push(disc);
  cmds.push(tube(skull, C.cyan, { a: fg, caps: 'both', capS: 0.6 }));
  const hair = [];
  for (let i = 0; i <= 8; i++) { const ph = lerp(-20, -200, i / 8) * Math.PI / 180, rr = hd.r + (i % 2 ? 15 : 5); hair.push(hl(Math.cos(ph) * rr, Math.sin(ph) * rr)); }
  cmds.push(tube(hair, C.violet, { wd: 5, a: 0.9 * fg, glow: 0.6 }));
  const ear = []; for (let i = 0; i < 10; i++) { const q = i / 10 * Math.PI * 2; ear.push(hl(-6 + Math.cos(q) * 7, 6 + Math.sin(q) * 8)); }
  cmds.push(tube(ear, C.cyan, { closed: true, smooth: true, wd: 4, a: 0.7 * fg, ns: true }));
  const blink = (t > 0.9 && t < 0.96) || (t > 1.9 && t < 1.95) || (t > 2.55 && t < 2.59) ? 0.1 : 1;
  cmds.push(tube([hl(18, -9), hl(18, -9 + 9 * blink)], C.white, { wd: 6, ns: true, a: fg }));
  const m0 = hl(14, lerp(18, 13, sm)), m1 = hl(21, lerp(18, 23, sm)), m2 = hl(30, lerp(17, 14, sm));
  cmds.push(tube([m0, m1, m2], C.cyan, { smooth: true, wd: 5, a: fg, ns: true }));

  // near arm on top of everything
  addArm(p.near, true);
}

// ---- the renderer ------------------------------------------------------------------------------------
function drawTube(c, k, it, gain) {
  const a = (it.a === undefined ? 1 : it.a) * gain;
  if (a < 0.02 && !it.off) return;
  const path = mkPath(it), col = it.col, wd = it.wd || 7, g = it.glow === undefined ? 1 : it.glow;
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (it.off) {                                                       // unlit glass
    c.globalCompositeOperation = 'source-over';
    c.strokeStyle = 'rgba(52,46,66,.95)'; c.lineWidth = wd; c.stroke(path);
    c.strokeStyle = 'rgba(150,140,190,.35)'; c.lineWidth = 2; c.stroke(path);
    c.globalCompositeOperation = 'lighter';
    return;
  }
  if (!it.ns) {
    c.shadowColor = rgba(col, 0.55 * a); c.shadowBlur = 30 * k * g;
    c.strokeStyle = rgba(col, 0.25 * a); c.lineWidth = wd + 2; c.stroke(path);
    c.shadowColor = rgba(col, 0.7 * a); c.shadowBlur = 10 * k * g;
    c.strokeStyle = rgba(col, 0.7 * a); c.lineWidth = wd + 3; c.stroke(path);
    c.shadowBlur = 0; c.shadowColor = 'rgba(0,0,0,0)';
  } else {
    c.strokeStyle = rgba(col, 0.85 * a); c.lineWidth = wd + 4; c.stroke(path);
  }
  c.strokeStyle = rgba(mixc(col, C.white, 0.82), a); c.lineWidth = wd; c.stroke(path);
}

function capsOf(it, out) {
  if (!it.caps || it.off) return;
  const P = it.pts, n = P.length;
  const end = (i, j) => { const dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1], l = Math.hypot(dx, dy) || 1; out.push({ x: P[i][0], y: P[i][1], dx: dx / l, dy: dy / l, s: it.capS || 1, a: Math.min(1, (it.a === undefined ? 1 : it.a)) }); };
  if (it.caps === 'both' || it.caps === 'start') end(0, 1);
  if (it.caps === 'both' || it.caps === 'end') end(n - 1, n - 2);
}

function render(ctx, t, w, h) {
  const k = w / W, Ls = layers(w), st = story(t), p = pose(t), age = st.shipAge, ship = st.screen.ship;
  const aux = { sign: { x: 520, y: 176, w: 450, h: 124 }, wordW: 0 };
  aux.wordW = word('SHIPPED', 0, 0, 72, 18).width;
  const cmds = [], shade = [];
  buildProps(t, st, p, cmds, aux);
  buildFigure(t, p, st, cmds, shade, aux);
  for (const q of particles(t)) {
    const col = [C.mag, C.cyan, C.amber, C.green][q.kind], hl = q.size * 1.15, dx = Math.cos(q.rot) * hl, dy = Math.sin(q.rot) * hl;
    cmds.push(tube([[q.x - dx, q.y - dy], [q.x + dx, q.y + dy]], col, { wd: 6, a: q.alpha, glow: 0.8 }));
  }
  // hand flare on each key tap
  const flare = p.tap;

  // 1. tube layer
  const T = Ls.Tx; T.setTransform(1, 0, 0, 1, 0, 0); T.globalCompositeOperation = 'source-over'; T.clearRect(0, 0, w, w);
  T.setTransform(k, 0, 0, k, 0, 0); T.globalCompositeOperation = 'lighter';
  const capList = [];
  for (const cm of cmds) {
    if (cm.t === 'tube') { drawTube(T, k, cm, 1); capsOf(cm, capList); }
    else if (cm.t === 'fill') { const [x, y, ww, hh] = cm.rect, gr = T.createLinearGradient(0, y, 0, y + hh); gr.addColorStop(0, rgba(cm.col, cm.a)); gr.addColorStop(1, rgba(cm.col, cm.a * 0.45)); T.fillStyle = gr; T.fillRect(x, y, ww, hh); }
    else if (cm.t === 'erase') {
      const path = mkPath(cm);
      T.globalCompositeOperation = 'destination-out'; T.fillStyle = 'rgba(0,0,0,.94)'; T.strokeStyle = 'rgba(0,0,0,.94)'; T.lineWidth = cm.pad || 6; T.lineJoin = 'round';
      T.fill(path); T.stroke(path); T.globalCompositeOperation = 'lighter';
    }
  }
  T.globalCompositeOperation = 'source-over';

  // 2. blur chain for bloom and wall spill
  const halve = (dst, src, blur) => { dst.x.setTransform(1, 0, 0, 1, 0, 0); dst.x.clearRect(0, 0, dst.c.width, dst.c.height); dst.x.imageSmoothingEnabled = true; dst.x.imageSmoothingQuality = 'high'; dst.x.filter = blur; dst.x.drawImage(src, 0, 0, dst.c.width, dst.c.height); dst.x.filter = 'none'; };
  halve({ c: Ls.H, x: Ls.Hx }, Ls.T, 'none');
  halve({ c: Ls.G1, x: Ls.G1x }, Ls.H, 'blur(1px)');
  halve({ c: Ls.G2, x: Ls.G2x }, Ls.G1, 'blur(2px)');
  halve({ c: Ls.G3, x: Ls.G3x }, Ls.G2, 'blur(2px)');

  // 3. wall light: spill from every glowing thing, multiplied by the brick texture
  const Lx = Ls.Lcx; Lx.setTransform(1, 0, 0, 1, 0, 0); Lx.globalCompositeOperation = 'source-over'; Lx.fillStyle = 'rgb(12,9,16)'; Lx.fillRect(0, 0, w, w);
  Lx.globalCompositeOperation = 'lighter'; Lx.imageSmoothingEnabled = true; Lx.imageSmoothingQuality = 'high';
  Lx.globalAlpha = 0.5; Lx.drawImage(Ls.G2, 0, 0, w, w); Lx.globalAlpha = 0.8; Lx.drawImage(Ls.G3, 0, 0, w, w); Lx.globalAlpha = 1;
  Lx.setTransform(k, 0, 0, k, 0, 0);
  const pulse = age >= 0 ? Math.exp(-age * 7) : 0;
  const lamp = (x, y, r, col, a) => { const g = Lx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(0.5, rgba(col, a * 0.35)); g.addColorStop(1, rgba(col, 0)); Lx.fillStyle = g; Lx.fillRect(x - r, y - r, r * 2, r * 2); };
  const sc = LAYOUT.laptop.screen, lgreen = mixc(C.cyan, C.green, ship);
  lamp(210, 330, 420, C.blue, 0.5 * flick(t, 1, 18, 0.05, 0.3));
  lamp(430, 170, 170, C.orange, 0.38 * flick(t, 2, 14, 0.14, 0.55));
  lamp(sc.x + sc.w / 2, sc.y + sc.h / 2, 380, lgreen, 0.55 * (0.4 + 0.6 * st.screen.awake) * (1 + pulse * 0.8));
  lamp(aux.sign.x + aux.sign.w / 2, aux.sign.y + aux.sign.h / 2, 330, C.mag, age >= 0 ? 0.55 * signLevel(age, 3) : 0);
  lamp(p.chest.x + 20, p.chest.y - 20, 360, C.cyan, 0.34);
  lamp(p.chest.x + 20, p.chest.y - 60, 300, C.mag, 0.3);
  lamp(880, 660, 200, C.lime, 0.18);
  lamp(900, 150, 300, [60, 20, 120], 0.3);
  Lx.setTransform(1, 0, 0, 1, 0, 0); Lx.globalCompositeOperation = 'multiply'; Lx.drawImage(Ls.B, 0, 0, w, w); Lx.globalCompositeOperation = 'source-over';

  // 4. compose
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#050409'; ctx.fillRect(0, 0, w, w);
  ctx.drawImage(Ls.Lc, 0, 0, w, w);
  ctx.setTransform(k, 0, 0, k, 0, 0);

  // floor: wet and dark, light pools under things
  const fy = LAYOUT.floor;
  let g = ctx.createLinearGradient(0, fy, 0, H); g.addColorStop(0, '#0d0a17'); g.addColorStop(1, '#030207');
  ctx.fillStyle = g; ctx.fillRect(0, fy, W, H - fy);
  ctx.fillStyle = '#020105'; ctx.fillRect(0, fy - 10, W, 10);                 // skirting
  ctx.fillStyle = 'rgba(160,130,200,.18)'; ctx.fillRect(0, fy - 10, W, 1.5);
  ctx.fillStyle = 'rgba(160,130,200,.10)'; ctx.fillRect(0, fy, W, 2);
  const rr = rng(5);
  for (let i = 0; i < 26; i++) {                                                // puddle sheen
    const y = fy + 6 + rr() * 190, x = rr() * W, wd = 80 + rr() * 260;
    const gg = ctx.createLinearGradient(x, 0, x + wd, 0); gg.addColorStop(0, 'rgba(150,120,255,0)'); gg.addColorStop(0.5, `rgba(150,120,255,${0.04 + rr() * 0.05})`); gg.addColorStop(1, 'rgba(150,120,255,0)');
    ctx.fillStyle = gg; ctx.fillRect(x, y, wd, 1.5 + rr() * 2.5);

  sheet(g, k, cut('ph1', () => polyline([[px + 19, py + 163], [px + 19, py + 108], [px + 50, py + 80], [px + 82, py + 112], [px + 108, py + 92], [px + 131, py + 118], [px + 131, py + 163]]), 0.8, 8), C.teal, 4);
  sheet(g, k, cut('ph2', () => polyline([[px + 19, py + 163], [px + 19, py + 136], [px + 58, py + 120], [px + 96, py + 140], [px + 131, py + 128], [px + 131, py + 163]]), 0.8, 8), C.coralD, 4);
  for (let i = 0; i < 6; i++) sheet(g, k, cut('pst' + i, () => ell(px + 30 + i * 17 + (i % 2) * 5, py + 34 + (i * 13) % 30, 1.7, 1.7, 6), 0.2, 3), C.creamS, 0, 0);

  // bunting: a string with paper flags, pinned off both sides of the box
  const sag = (x) => 44 + 48 * (1 - Math.pow((x - 500) / 520, 2));
  const str = []; for (let x = -20; x <= 1020; x += 20) str.push([x, sag(x)]);
  g.strokeStyle = C.kraftDD; g.lineWidth = 2.4; shade(g, k, 3, 0.3); g.beginPath(); g.moveTo(str[0][0], str[0][1]); for (const p of str) g.lineTo(p[0], p[1]); g.stroke(); noShade(g);
  const cols = [C.coral, C.mustard, C.teal, C.creamS, C.coralL, C.tealL];
  for (let i = 0, x = 46; x < 980; x += 54, i++) {
    const y = sag(x), sl = Math.atan2(sag(x + 5) - sag(x - 5), 10);
    piece(g, k, x, y, sl, cut('flag' + i, () => [[-21, -1], [21, -1], [0, 38]], 0.8, 8), cols[i % cols.length], 6);
  }

  // baseboard: a coral strip over the foot of the wall, then paper floor planks laid on the kraft sheet
  sheet(g, k, cut('base', () => rect(-20, 782, W + 40, 18), 1.0, 12), C.coral, 6);
  const planks = [[812, 50, C.kraft], [878, 58, '#c4955b'], [950, 90, C.kraft]];
  planks.forEach(([y, h, col], i) => sheet(g, k, cut('plank' + i, () => rect(-20, y, W + 40, h), 1.5, 14), col, 7, 0.2));
  // a rug of two paper ovals on the planks
  sheet(g, k, cut('rug0', () => ell(520, 888, 250, 34, 44), 1.4, 10), C.coralD, 5);
  sheet(g, k, cut('rug1', () => ell(520, 888, 226, 26, 44), 1.2, 10), C.creamS, 1, 0.1);
  sheet(g, k, cut('rug2', () => ell(520, 888, 190, 19, 44), 1.0, 10), C.teal, 2, 0.1);
  // plank seams
  g.strokeStyle = 'rgba(90,56,26,.22)'; g.lineWidth = 1.5;
  [[190, 812, 862], [620, 812, 862], [820, 878, 936], [330, 878, 936], [100, 950, 1010], [520, 950, 1010], [900, 950, 1010]].forEach(([x, y0, y1]) => { g.beginPath(); g.moveTo(x, y0 + 3); g.lineTo(x + 2, y1 - 3); g.stroke(); });
}

  sheet(g, k, cut('bk2s', () => rect(bx + 16, D.y - 34, 60, 4), 0.4, 8), C.mustardL, 0, 0);
  sheet(g, k, cut('bk3', () => rect(bx + 2, D.y - 58, 70, 18), 0.7, 9), C.navy, 4);
  sheet(g, k, cut('mug', () => rrect(bx + 20, D.y - 90, 34, 32, 6), 0.7, 8), C.coral, 5);

  sheet(g, k, cut('mugs', () => rect(bx + 20, D.y - 78, 34, 5), 0.4, 8), C.creamS, 0, 0);

// ---- live layers --------------------------------------------------------------------------------------------
function clockHands(g, k, tp) {
  const cl = LAYOUT.clock;
  const min = -2.0 * Math.max(0, 1 - tp / 2.8) - 0.02, hour = -0.18;
  piece(g, k, cl.x, cl.y, hour - Math.PI / 2, cut('hh', () => [[-4, -3], [15, -2], [17, 0], [15, 2], [-4, 3]], 0.3, 5), C.ink, 3);
  piece(g, k, cl.x, cl.y, min - Math.PI / 2, cut('mh', () => [[-5, -2], [24, -1.4], [27, 0], [24, 1.4], [-5, 2]], 0.3, 5), C.ink, 3);
  brad(g, k, cl.x, cl.y, 4);
}

function starburst(g, k, age) {
  if (age < 0) return;
  const R = 170 * spring(age / 1.1), cx = LAYOUT.laptop.screen.x + 100, cy = LAYOUT.laptop.screen.y + 80;
  const rot = Math.floor(age * 12) * 0.035;
  g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(R / 100, R / 100);
  const sp = (n, ro, ri) => { const o = []; for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * TAU, r = i % 2 ? ri : ro; o.push([Math.cos(a) * r, Math.sin(a) * r]); } return o; };
  sheet(g, k / (R / 100 || 1), cut('burstA', () => sp(16, 100, 66), 1.0, 14), C.mustardL, 9 * (R / 100));
  g.rotate(TAU / 32);
  sheet(g, k / (R / 100 || 1), cut('burstB', () => sp(16, 80, 52), 0.9, 12), C.coralL, 6 * (R / 100));
  g.restore();
}

function laptop(g, k, t, tp, p) {
  const L = LAYOUT.laptop, S = L.screen, st = story(t), sc = st.screen;
  const age = t - 2.8;
  // lid and screen paper
  sheet(g, k, cut('lid', () => rrect(S.x - 10, S.y - 10, S.w + 20, S.h + 18, 9), 0.8, 10), C.ink, 12, 0.14);
  const awake = sc.awake;
  const sheetCol = awake < 0.5 ? '#2b2a35' : C.navy;
  sheet(g, k, cut('scr', () => rect(S.x, S.y, S.w, S.h), 0.6, 10), sheetCol, 2, 0);
  g.save();
  g.beginPath(); g.rect(S.x, S.y, S.w, S.h); g.clip();
  const rc = [C.creamS, C.tealL, C.mustardL, C.coralL, C.tealL, C.creamS];
  sc.rows.forEach((row, i) => {
    if (row.len <= 0.001) return;
    const x0 = S.x + 14 + row.indent * 160, y0 = S.y + 18 + i * 22, w = Math.max(3, row.w * 170 * row.len);
    // a short coloured keyword chip then the rest of the line, like syntax colour in cut paper
    const chip = Math.min(w, 24);
    g.save(); g.translate(x0, y0); g.scale(chip / 24, 1);
    sheet(g, k, cut('rowa' + i, () => rect(0, 0, 24, 10), 0.4, 8), rc[(i + 1) % 6], 2.5, 0.0);
    g.restore();
    if (w > 30) { g.save(); g.translate(x0 + 28, y0); g.scale((w - 28) / 100, 1); sheet(g, k, cut('rowb' + i, () => rect(0, 0, 100, 10), 0.5, 10), rc[i % 6], 2.5, 0); g.restore(); }
  });
  // text cursor while typing
  if (sc.typed > 0.02 && sc.typed < 0.999 && Math.floor(tp * 6) % 2 === 0) {
    const ri = clamp(Math.floor(sc.typed * 6.4), 0, 5), row = sc.rows[ri];
    g.save(); g.translate(S.x + 14 + row.indent * 160 + row.w * 170 * row.len + 6, S.y + 17 + ri * 22); g.fillStyle = C.mustardL; g.fillRect(0, 0, 7, 12); g.restore();
  }
  // ship: a green sheet slides down over the old screen paper
  if (age >= 0) {
    const e = 1 - Math.pow(1 - clamp(age / 0.16), 3), off = -(1 - e) * (S.h + 24);
    g.save(); g.translate(0, off);
    sheet(g, k, cut('gscr', () => rect(S.x - 2, S.y - 2, S.w + 4, S.h + 4), 0.6, 10), C.green, 9, 0);
    sheet(g, k, cut('gin', () => rect(S.x + 9, S.y + 9, S.w - 18, S.h - 18), 0.7, 10), C.greenL, 3, 0.2);
    g.restore();
    // a big cut-out tick, popping on a spring
    const sp = spring((age - 0.12) / 0.9);
    if (age > 0.12) {
      g.save(); g.translate(S.x + 100, S.y + 56); g.rotate(-0.05); g.scale(sp, sp);
      sheet(g, k, cut('tick', () => [[-36, 2], [-23, -11], [-9, 5], [28, -34], [41, -21], [-9, 31]], 0.7, 7), C.creamS, 6);
      g.restore();
    }
  }
  g.restore();
  // paper label and tape, outside the clip so they can lap over the lid
  if (age >= 0.2) {
    const sp = spring((age - 0.2) / 0.9);
    g.save(); g.translate(S.x + 100, S.y + 118); g.rotate(-0.045); g.scale(sp, sp);
    sheet(g, k, cut('lab0', () => rect(-92, -25, 184, 50), 0.9, 10), C.coral, 8);
    sheet(g, k, cut('lab1', () => rect(-86, -19, 172, 38), 0.7, 10), C.creamS, 1, 0.1);
    g.font = '900 25px Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.letterSpacing = '2px'; g.fillStyle = C.navy; g.fillText('SHIPPED', 1, 2); g.letterSpacing = '0px';
    g.restore();
  }
  if (age >= 0.16) {
    const sp = spring((age - 0.16) / 0.5);
    for (const [tx, ty, a] of [[S.x + 8, S.y + 4, -0.75], [S.x + S.w - 8, S.y + 4, 0.75]]) {
      g.save(); g.translate(tx, ty); g.rotate(a); g.scale(sp, sp);
      g.globalAlpha = 0.86; sheet(g, k, cut('tape', () => rect(-24, -8, 48, 16), 0.9, 6), '#f6e7b0', 3, 0.3);
      g.restore();
    }
  }
  // keyboard slab with key caps
  sheet(g, k, cut('kbslab', () => rrect(L.base.x, L.base.y, L.base.w, L.base.h + 2, 3), 0.7, 10), '#4c4a5a', 9, 0.2);
  const hit = p.tap > 0 ? clamp(Math.round((tp - 2.4) / 0.2), 0, 2) : -1;
  for (let i = 0; i < 13; i++) {
    const kx = L.base.x + 10 + i * 16.4, on = hit >= 0 && i === [3, 5, 4][hit];
    sheet(g, k, cut('key' + i, () => rect(kx, L.base.y + 3, 12, 6), 0.3, 6), on ? C.mustardL : C.creamD, 0, 0);
  }
}

function plant(g, k, t, tp) {
  const px = LAYOUT.plant.x, py = LAYOUT.plant.y, top = py - 66, age = tp - 2.8;
  const defs = [[-82, 96, 30, C.tealD], [-58, 132, 34, C.teal], [-30, 158, 36, C.tealL], [-2, 172, 36, C.teal], [26, 156, 36, C.tealD], [54, 134, 34, C.tealL], [80, 100, 30, C.teal], [104, 66, 24, C.tealD]];
  defs.forEach(([deg, len, wd, col], i) => {
    const wob = Math.sin(tp * 2.6 + i * 1.7) * 0.03 + (age > 0 ? 0.2 * Math.exp(-age * 3.2) * Math.sin(age * 26 + i * 0.9) : 0);
    const a = ((deg - 90) * Math.PI) / 180 + wob;
    piece(g, k, px, top + 6, a, cut('leaf' + i, () => [[0, 0], [len * 0.28, -wd * 0.62], [len * 0.62, -wd * 0.5], [len * 0.9, -wd * 0.16], [len, 0], [len * 0.9, wd * 0.16], [len * 0.62, wd * 0.5], [len * 0.28, wd * 0.62]], 0.9, 9), col, 9);
    g.save(); g.translate(px, top + 6); g.rotate(a); g.strokeStyle = 'rgba(255,255,255,.26)'; g.lineWidth = 2; g.beginPath(); g.moveTo(8, 0); g.lineTo(len * 0.86, 0); g.stroke(); g.restore();
  });
  sheet(g, k, cut('pot', () => [[px - 38, top], [px + 38, top], [px + 29, py], [px - 29, py]], 1.0, 10), C.coral, 11);
  sheet(g, k, cut('potband', () => [[px - 34, top + 30], [px + 34, top + 30], [px + 32, top + 40], [px - 32, top + 40]], 0.6, 9), C.creamS, 1, 0);
  sheet(g, k, cut('rim', () => rect(px - 44, top - 8, 88, 18), 0.9, 10), C.coralD, 6);
  brad(g, k, px, top + 6, 5);
}

// ---- the puppet ---------------------------------------------------------------------------------------------
function puppet(g, k, tp, fr) {
  const p = pose(tp);
  const R = rng(fr * 7919 + 31);
  const wob = (a = 0.03) => (R() - 0.5) * a;
  const smile = p.celebrate > 0.25 || p.hop > 1;

  const leg = (s, far) => {
    const jean = far ? C.denimD : C.denim, cuff = far ? '#5877ac' : C.denimL, shoe = far ? '#d9c9a2' : C.creamS, sole = far ? C.mustardD : C.mustard, d = far ? 9 : 13;
    piece(g, k, s.hip.x, s.hip.y, ang(s.hip, s.knee) + wob(), cut('thigh', () => capsule(DIMS.thigh, 36, 27), 1.1, 10), jean, d);
    const a2 = ang(s.knee, s.ankle) + wob();
    piece(g, k, s.knee.x, s.knee.y, a2, cut('shin', () => capsule(DIMS.shin, 26, 20), 1.0, 10), jean, d);
    piece(g, k, s.knee.x, s.knee.y, a2, cut('cuff', () => rect(DIMS.shin - 22, -11, 14, 22), 0.7, 6), cuff, d * 0.3);
    brad(g, k, s.knee.x, s.knee.y, 5.6);
    const sa = Math.atan2(s.toe.y - s.ankle.y - 12, s.toe.x - s.ankle.x);
    g.save(); g.translate(s.ankle.x, s.ankle.y); g.rotate(sa);
    sheet(g, k, cut('shoe', () => [[-17, -3], [-12, -12], [7, -13], [11, -4], [25, 0], [41, 5], [48, 10], [47, 13], [-17, 13]], 0.9, 8), shoe, d);
    sheet(g, k, cut('sole', () => [[-17, 8], [47, 8], [47, 13], [-17, 13]], 0.5, 8), sole, 0, 0.1);
    sheet(g, k, cut('lace', () => rect(12, -3, 11, 3), 0.3, 6), far ? C.coralD : C.coral, 0, 0);
    g.restore();
    brad(g, k, s.ankle.x, s.ankle.y - 2, 4.4);
  };
  const arm = (s, far) => {
    const sl = far ? C.coralD : C.coral, cu = far ? '#a53f31' : C.coralD, hd = far ? C.peachD : C.peach, d = far ? 8 : 12;
    piece(g, k, s.shoulder.x, s.shoulder.y, ang(s.shoulder, s.elbow) + wob(), cut('uarm', () => capsule(DIMS.upperArm, 27, 22), 1.0, 10), sl, d);
    const a2 = ang(s.elbow, s.hand) + wob();
    g.save(); g.translate(s.elbow.x, s.elbow.y); g.rotate(a2);
    sheet(g, k, cut('farm', () => capsule(DIMS.foreArm, 22, 18), 0.9, 10), sl, d);
    sheet(g, k, cut('wrist', () => rect(DIMS.foreArm - 18, -10, 11, 20), 0.6, 6), cu, 0, 0.1);
    sheet(g, k, cut('hand', () => ell(DIMS.foreArm + 5, 0, 12, 11, 16), 0.7, 6), hd, d * 0.6);
    g.restore();
    brad(g, k, s.elbow.x, s.elbow.y, 5.2);
    if (!far) brad(g, k, s.shoulder.x, s.shoulder.y, 5.6);
  };

  arm(p.far, true);
  leg(p.far, true);
  leg(p.near, false);

  // hoodie torso, in its own frame: x runs pelvis to neck, +y is the front
  const aT = ang(p.pelvis, p.neck) + wob(0.016), TL = DIMS.torso;
  g.save(); g.translate(p.pelvis.x, p.pelvis.y); g.rotate(aT);
  sheet(g, k, cut('torso', () => [[-15, -31], [30, -33], [80, -30], [110, -26], [126, -17], [129, 0], [126, 17], [110, 28], [80, 32], [34, 34], [-15, 35]], 1.2, 10), C.coral, 14);
  sheet(g, k, cut('hem', () => rect(-15, -31, 15, 66), 0.6, 8), C.coralD, 0, 0.1);
  sheet(g, k, cut('pocket', () => [[6, 7], [46, 5], [52, 29], [6, 31]], 0.7, 8), C.coralD, 3, 0.12);
  // hood bunched behind the neck, and drawstrings
  sheet(g, k, cut('hood', () => ell(TL - 4, -9, 17, 28, 20), 0.8, 8), C.coralD, 5, 0.12);
  sheet(g, k, cut('str1', () => rect(76, 11, 34, 3), 0.25, 6), C.creamS, 1.5, 0);
  sheet(g, k, cut('str2', () => rect(88, 19, 30, 3), 0.25, 6), C.creamS, 1.5, 0);
  // headphones round the neck: a teal band and a mustard cup resting on the chest
  sheet(g, k, cut('band', () => [ell(TL - 2, 1, 16, 33, 28), ell(TL - 2, 1, 7.5, 24, 22)], 0.5, 6), C.teal, 4, 0.2);
  sheet(g, k, cut('cup', () => rrect(TL - 46, 10, 38, 30, 8), 0.7, 8), C.mustard, 7, 0.3);
  sheet(g, k, cut('cupi', () => rrect(TL - 41, 15, 28, 20, 6), 0.5, 8), C.mustardD, 0, 0.15);
  g.restore();

  // head: a peach disc with a nose tab, ear, hair cap, eye
  const hd = p.head;
  g.save(); g.translate(hd.x, hd.y); g.rotate(hd.angle + wob(0.03));
  const headPts = cut('head', () => {
    const o = []; for (let i = 0; i <= 24; i++) { const a = (20 + (320 * i) / 24) * Math.PI / 180; o.push([Math.cos(a) * 38, Math.sin(a) * 38]); }
    o.push([37, -9], [40, -3], [47, 7], [39, 12]); return o;
  }, 0.9, 7);
  sheet(g, k, headPts, C.peach, 15);
  sheet(g, k, cut('ear', () => ell(-5, 6, 7.5, 9.5, 14), 0.5, 5), C.peachD, 3, 0.15);
  sheet(g, k, cut('hair', () => {
    const o = []; for (let i = 0; i <= 20; i++) { const a = (155 + (190 * i) / 20) * Math.PI / 180, bump = i === 6 || i === 7 ? 9 : 0; o.push([Math.cos(a) * (43 + bump * 0.6), Math.sin(a) * (43 + bump)]); }
    o.push([36, -16], [30, -10], [22, -19], [13, -11], [4, -20], [-6, -12], [-17, -19], [-27, -9], [-32, 4], [-37, 16]); return o;
  }, 0.9, 7), C.hair, 6, 0.1);
  // face: eye (blinks on a few frames), brow, blush, mouth
  const blink = fr % 40 === 17 || fr % 40 === 18;
  g.fillStyle = C.ink;
  const look = p.reach > 0.5 ? 1.5 : 0;
  g.beginPath(); g.ellipse(19 + look, -2, 3.3, blink ? 0.8 : 3.8, 0, 0, TAU); g.fill();
  g.strokeStyle = C.hair; g.lineWidth = 2.6; g.lineCap = 'round'; g.beginPath(); g.moveTo(12, -11 - (smile ? 2 : 0)); g.lineTo(25, -12 - (smile ? 3 : 0)); g.stroke();
  g.fillStyle = 'rgba(238,107,86,.55)'; g.beginPath(); g.ellipse(21, 12, 6.5, 4.2, 0, 0, TAU); g.fill();
  g.strokeStyle = C.ink; g.lineWidth = 2.4;
  g.beginPath();
  if (smile) { g.arc(23, 15, 9, 0.15 * Math.PI, 0.8 * Math.PI); } else { g.moveTo(19, 22); g.lineTo(28, 21); }
  g.stroke();
  g.restore();

  arm(p.near, false);
  return p;
}

// ---- confetti: cut paper scraps with their own shadows --------------------------------------------------------
function confetti(g, k, t) {
  const cols = [C.coral, C.mustard, C.teal, C.navyL, C.green, C.coralL];
  for (const q of particles(t)) {
    const col = cols[q.i % cols.length], flip = 0.3 + 0.7 * Math.abs(Math.cos(q.rot * 0.9 + q.i)), s = q.size / 10;
    let pts;
    if (q.kind === 0) pts = cut('cf0', () => ell(0, 0, 8, 8, 14), 0.5, 4);
    else if (q.kind === 1) pts = cut('cf1', () => star(0, 0, 10, 4.4, 5), 0.4, 4);
    else if (q.kind === 2) pts = cut('cf2', () => rect(-9, -5, 18, 10), 0.5, 5);
    else pts = cut('cf3', () => rect(-3.5, -12, 7, 24), 0.4, 6);
    g.save(); g.globalAlpha = q.alpha; g.translate(q.x, q.y); g.rotate(q.rot); g.scale(s, s * flip);
    sheet(g, k, pts, col, 9 / (s * flip + 0.2), 0.2);
    g.restore();
  }
  g.globalAlpha = 1;
}

// ---- the shadow box itself: sloped inner walls, nearest layer -------------------------------------------------

function keyTex(p) {
  const tp = p.tap, key = Math.floor(p.t * 5 + 0.3) % 3;
  return tex(32, 16, (x, y) => {
    if (x < 1 || y < 1 || x > 30 || y > 14) return [52, 54, 64];
    if (y % 3 === 0 || x % 3 === 0) return [40, 42, 52];
    if (tp > 0.3) { const kx = [8, 15, 22][key], ky = [5, 8, 5][key]; if (Math.abs(x - kx) < 2 && Math.abs(y - ky) < 2) return [255, 250, 140]; }
    return [112, 116, 134];
  });
}
function screenTex(st, p) {
  const s = st.screen, ship = s.ship, aw = s.awake;
  const CC = [[90, 220, 255], [255, 130, 210], [255, 214, 100], [90, 220, 255], [170, 130, 255], [255, 130, 210]];
  const bg = [lerp(10, 18, aw), lerp(12, 34, aw), lerp(18, 74, aw)];
  const cv = new Uint8ClampedArray(48 * 36 * 3);
  const put = (x, y, c) => { if (x < 0 || y < 0 || x >= 48 || y >= 36) return; const i = (y * 48 + x) * 3; cv[i] = c[0]; cv[i + 1] = c[1]; cv[i + 2] = c[2]; };
  for (let y = 0; y < 36; y++) for (let x = 0; x < 48; x++) put(x, y, (y & 1) ? bg : [bg[0] * 0.9, bg[1] * 0.9, bg[2] * 0.9]);
  for (let x = 0; x < 48; x++) { put(x, 0, [44, 56, 110]); put(x, 1, [44, 56, 110]); }
  s.rows.forEach((r, i) => { const n = Math.round(r.w * 40 * r.len), x0 = 3 + Math.round(r.indent * 40); for (let x = 0; x < n; x++) { put(x0 + x, 5 + i * 5, CC[i]); put(x0 + x, 6 + i * 5, CC[i]); } });
  const out = tex(48, 36, (x, y) => {
    const i = (y * 48 + x) * 3; let c = [cv[i], cv[i + 1], cv[i + 2]];
    if (ship > 0) { const g = [lerp(20, 40, (y & 1) * 0.5), 168 - (y & 1) * 10, 78]; c = [lerp(c[0], g[0], ship), lerp(c[1], g[1], ship), lerp(c[2], g[2], ship)]; }
    return c;
  });
  if (ship > 0.4) {
    const put2 = (x, y, w, h, c) => { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) { if (xx < 0 || yy < 0 || xx >= 48 || yy >= 36) continue; const i = (yy * 48 + xx) * 4; out.d[i] = c[0]; out.d[i + 1] = c[1]; out.d[i + 2] = c[2]; } };
    for (let i = 0; i < 7; i++) put2(10 + i * 2, 14 + i * 2, 5, 5, [255, 255, 255]);
    for (let i = 0; i < 13; i++) put2(23 + i * 2, 26 - i * 2, 5, 5, [255, 255, 255]);
  }
  return out;
}

// ---- 2d overlays drawn straight into the frame buffer ----------------------------------------------------------------------
function overlay(fb, st, t) {
  const age = st.shipAge;
  if (age < 0) return;
  const put = (x, y, w, h, c) => { for (let yy = Math.max(0, y); yy < Math.min(R, y + h); yy++) for (let xx = Math.max(0, x); xx < Math.min(R, x + w); xx++) { const i = (yy * R + xx) * 4; fb[i] = c[0]; fb[i + 1] = c[1]; fb[i + 2] = c[2]; } };

  const slide = Math.round((1 - smooth(0, 0.16, age)) * -34), show = age > 0.14 || Math.floor(age * 40) % 2 === 0;
  if (show) {
    const y0 = 8 + Math.round(slide / 2), x0 = 33;
    put(x0, y0, 94, 24, [10, 14, 12]); put(x0, y0, 94, 1, GREEN); put(x0, y0 + 23, 94, 1, GREEN); put(x0, y0, 1, 24, GREEN); put(x0 + 93, y0, 1, 24, GREEN);
    drawText(put, 'SHIPPED', x0 + 6 + 1, y0 + 5 + 1, 2, DARKG);
    drawText(put, 'SHIPPED', x0 + 6, y0 + 5, 2, GREEN);
  }
  if (age > 0.1) {
    // memory card icon with a blinking LED, and SAVING...
    const bx = 141, by = 134, ph = Math.floor((age - 0.1) * 9);
    put(bx - 1, by - 1, 16, 21, [10, 10, 16]);
    put(bx, by, 14, 19, [150, 156, 176]); put(bx + 9, by, 5, 4, [10, 10, 16]);
    put(bx + 2, by + 5, 10, 7, [56, 66, 150]); put(bx + 4, by + 7, 6, 1, [200, 210, 255]); put(bx + 4, by + 9, 4, 1, [200, 210, 255]);
    for (let i = 0; i < 4; i++) put(bx + 2 + i * 3, by + 14, 2, 4, [226, 184, 64]);
    put(bx + 11, by + 6, 2, 2, ph % 2 ? [120, 255, 120] : [20, 70, 30]);

    drawText(put, 'SAVING', 85, 144, 1, [236, 240, 230]);

const LOOP = rig.T + 0.9;                       // a short hold on the last frame before it starts again
