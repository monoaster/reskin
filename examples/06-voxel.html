<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>reskin 06-voxel</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0c0e2b; color: #f1eefb; font: 15px/1.4 ui-monospace, Menlo, monospace; }
  body { display: grid; place-items: center; }
  main { width: min(92vmin, 920px); }
  canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: 18px; background: #000; }
  p { margin: 10px 2px 0; display: flex; justify-content: space-between; gap: 12px; opacity: .8; }
  a { color: inherit; }</style>
<main><canvas id="c" width="1000" height="1000"></canvas>
<p><span>reskin / 06-voxel</span><span>prompt: prompts/06-voxel.md</span></p></main>
<script>
const rig = (() => {
// reskin rig: one character, one scene, one 3.2 second walk. Every style draws from this.
//
// World: a 1000 x 1000 square, y points down, the floor is y = 800.
// The beat is 150 bpm (0.4 s). Footfalls land on the beat, the build passes on beat 7 (t = 2.8).
//
//   0.0 - 2.0   walks in from the left, slows to a stop at x = 490
//   2.0 - 2.4   raises the near hand to the laptop keyboard
//   2.4 - 2.8   types (three key taps: 2.4, 2.6, 2.8), code rows fill the screen
//   2.8         the build passes: the screen flips, confetti, a hop
//   2.8 - 3.2   fist pump, then the clip ends
//
// Everything here is a pure function of t. No randomness, no clock: call it with any t, in any order.

const W = 1000;
const H = 1000;
const FLOOR = 800;
const T = 3.2;            // seconds per style
const BPM = 150;
const BEAT = 0.4;
const SHIP_T = 2.8;       // the moment the build passes

const LAYOUT = {
  floor: FLOOR,
  desk:   { x: 560, y: 610, w: 400, h: 190 },                 // table top is y = 610
  laptop: { base: { x: 600, y: 598, w: 230, h: 12 },          // keyboard slab, sits on the desk
            screen: { x: 615, y: 440, w: 200, h: 158 } },      // facing the viewer
  hand:   { x: 650, y: 594 },                                  // where the near hand lands on the keys
  window: { x: 80, y: 130, w: 260, h: 350 },
  clock:  { x: 430, y: 170, r: 34 },
  plant:  { x: 880, y: 800 },
};

const DIMS = {
  thigh: 100, shin: 98, upperArm: 92, foreArm: 86,
  torso: 124, neck: 16, headR: 38,
  thighW: 24, shinW: 19, upperArmW: 17, foreArmW: 15, torsoW: 58, footLen: 40, footH: 14,
  depth: 26,   // z offset of the near / far limbs, for 3D styles
};

const SCREEN_LINES = [
  'const build = await ship()',
  'if (build.ok) {',
  '  deploy(build)',
  '}',
  'tests: 42 passed',
  'status: SHIPPED',
];

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, v) => { const k = clamp((v - a) / (b - a)); return k * k * (3 - 2 * k); };
const easeInOut = (k) => k * k * (3 - 2 * k);

// ---- where the body is --------------------------------------------------------------------
const X0 = -40, X1 = 490, CRUISE_END = 1.5, STOP = 2.0;
const V = (X1 - X0) / (CRUISE_END + (STOP - CRUISE_END) / 2);   // px per second while cruising

function bodyX(t) {
  if (t <= CRUISE_END) return X0 + V * Math.max(t, -1);
  if (t >= STOP) return X1;
  const u = (t - CRUISE_END) / (STOP - CRUISE_END);               // linear slow-down to a stop
  return X0 + V * CRUISE_END + V * (STOP - CRUISE_END) * (u - u * u / 2);
}

// Feet plant in world space on the beat, so nothing slides. Each foot has a 0.8 s cycle:
// 0 - 0.6 planted, 0.6 - 1 swinging to the next planting spot, which is under the pelvis at mid-stance.
function footTrack(t, offset, side) {
  const P = 0.8, STANCE = 0.6;
  const n = Math.floor((t - offset) / P);
  const u = (t - offset) / P - n;
  const land = (k) => bodyX(offset + k * P + 0.24) + side * 6;
  const L0 = land(n), L1 = land(n + 1);
  if (u < STANCE) return { x: L0, lift: 0, swing: -1, u };
  const s = (u - STANCE) / (1 - STANCE);
  return { x: lerp(L0, L1, easeInOut(s)), lift: Math.sin(Math.PI * s), swing: s, u };
}

function ik2(ax, ay, tx, ty, l1, l2, sgn) {
  let dx = tx - ax, dy = ty - ay;
  let d = Math.hypot(dx, dy);
  const max = l1 + l2 - 0.5;
  if (d > max) { tx = ax + dx * max / d; ty = ay + dy * max / d; dx = tx - ax; dy = ty - ay; d = max; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = ax + a * dx / d, my = ay + a * dy / d;
  return { x: mx + sgn * h * (-dy / d), y: my + sgn * h * (dx / d), tx, ty };
}

// ---- the pose -----------------------------------------------------------------------------
// Returns joints as {x, y, z}. z is -1 (far side), 0 (spine) or +1 (near side) so 3D styles can push limbs apart.
function pose(t) {
  t = clamp(t, 0, T);
  const D = DIMS;
  const walk = 1 - smooth(1.55, 2.05, t);             // 1 while walking, 0 once stopped
  const reach = smooth(2.0, 2.45, t);                 // near hand goes to the keyboard
  const celebrate = smooth(2.82, 3.0, t);             // fist pump
  const tapPulse = (t0) => { const k = (t - t0) / 0.12; return k > 0 && k < 1 ? Math.sin(Math.PI * k) : 0; };
  const tap = Math.max(tapPulse(2.4), tapPulse(2.6), tapPulse(2.8));
  const hopK = clamp((t - 2.84) / 0.34);
  const hop = 34 * Math.sin(Math.PI * hopK);

  const px = bodyX(t) + 0;
  const bob = walk * 7 * (0.5 + 0.5 * Math.cos(2 * Math.PI * t / BEAT));
  const standH = 196;
  const py = FLOOR - standH + bob - hop;
  const lean = 0.05 * walk + 0.16 * reach * (1 - celebrate * 0.7) - 0.04 * celebrate;

  const sx = px + Math.sin(lean) * D.torso * 0.96;
  const sy = py - Math.cos(lean) * D.torso * 0.96;
  const neck = { x: px + Math.sin(lean) * D.torso, y: py - Math.cos(lean) * D.torso, z: 0 };
  const headTilt = lean + 0.1 * reach - 0.1 * celebrate;
  const head = { x: neck.x + Math.sin(headTilt) * (D.neck + D.headR), y: neck.y - Math.cos(headTilt) * (D.neck + D.headR), z: 0, r: D.headR, angle: headTilt };

  // legs
  const fN = footTrack(t, 0.0, +1);       // near foot lands on t = 0, 0.8, 1.6 ...
  const fF = footTrack(t, 0.4, -1);       // far foot lands on t = 0.4, 1.2, 2.0 ...
  const settle = 1 - walk;
  const stand = (side) => px + side * 16;
  const legJoints = (f, side, z) => {
    const fx = lerp(f.x, stand(side) + 0, settle);
    const lift = f.lift * 46 * walk + hop * 0.9;
    const ay = FLOOR - 12 - lift;
    const hip = { x: px + side * 4, y: py, z };
    const k = ik2(hip.x, hip.y, fx, ay, D.thigh, D.shin, -1);
    const pitch = f.swing < 0 ? 0 : lerp(0.55, -0.3, f.swing);
    const pitchAir = hop > 2 ? 0.25 : pitch;
    const toe = { x: k.tx + Math.cos(pitchAir) * D.footLen, y: k.ty + 12 + Math.sin(pitchAir) * D.footLen * 0.6 - (hop > 2 ? 0 : 0), z };
    if (f.swing < 0 && hop < 2) toe.y = FLOOR;
    return { hip, knee: { x: k.x, y: k.y, z }, ankle: { x: k.tx, y: k.ty, z }, toe };
  };
  const legN = legJoints(fN, +1, +1);
  const legF = legJoints(fF, -1, -1);

  // arms
  const swingA = 0.62 * walk;
  const thN = -swingA * Math.cos(2 * Math.PI * t / (BEAT * 2));
  const thF = +swingA * Math.cos(2 * Math.PI * t / (BEAT * 2));
  const armLen = 150;
  const shoulderN = { x: sx + 3, y: sy, z: +1 }, shoulderF = { x: sx - 3, y: sy, z: -1 };
  const hangN = { x: shoulderN.x + Math.sin(thN + 0.05) * armLen, y: shoulderN.y + Math.cos(thN + 0.05) * armLen };
  const hangF = { x: shoulderF.x + Math.sin(thF + 0.05) * armLen, y: shoulderF.y + Math.cos(thF + 0.05) * armLen };
  const keys = { x: LAYOUT.hand.x, y: LAYOUT.hand.y - tap * 9 };
  const up = { x: shoulderN.x + 52, y: shoulderN.y - 150 - Math.sin(t * 40) * 3 * celebrate };
  let tgtN = { x: lerp(hangN.x, keys.x, reach), y: lerp(hangN.y, keys.y, reach) };
  tgtN = { x: lerp(tgtN.x, up.x, celebrate), y: lerp(tgtN.y, up.y, celebrate) };
  const tgtF = { x: hangF.x + (hop > 0 ? -18 : 0), y: hangF.y - hop * 0.4 };
  const aN = ik2(shoulderN.x, shoulderN.y, tgtN.x, tgtN.y, D.upperArm, D.foreArm, +1);
  const aF = ik2(shoulderF.x, shoulderF.y, tgtF.x, tgtF.y, D.upperArm, D.foreArm, +1);

  return {
    t, walk, reach, celebrate, tap, hop, lean, facing: 1,
    pelvis: { x: px, y: py, z: 0 }, chest: { x: lerp(px, sx, 0.55), y: lerp(py, sy, 0.55), z: 0 }, neck, head,
    near: { hip: legN.hip, knee: legN.knee, ankle: legN.ankle, toe: legN.toe, shoulder: shoulderN, elbow: { x: aN.x, y: aN.y, z: +1 }, hand: { x: aN.tx, y: aN.ty, z: +1 } },
    far:  { hip: legF.hip, knee: legF.knee, ankle: legF.ankle, toe: legF.toe, shoulder: shoulderF, elbow: { x: aF.x, y: aF.y, z: -1 }, hand: { x: aF.tx, y: aF.ty, z: -1 } },
  };
}

// ---- the story around the body -----------------------------------------------------------------
// screen.awake: laptop wakes while the hand lifts. screen.typed: 0..1 of the code on screen.
// screen.ship: 0 -> 1 across the flip to the green "SHIPPED" state. shipAge: seconds since it passed (or -1).
function story(t) {
  const typed = smooth(2.38, 2.8, t);
  const ship = smooth(SHIP_T, SHIP_T + 0.12, t);
  const awake = smooth(1.7, 2.0, t);
  const rows = [0.55, 0.8, 0.45, 0.2, 0.7, 0.35].map((w, i) => ({
    w, indent: [0, 0, 0.12, 0, 0, 0.12][i],
    len: clamp(typed * 6.4 - i, 0, 1),
  }));
  const chars = SCREEN_LINES.map((s, i) => s.slice(0, Math.round(s.length * clamp(typed * 6.4 - i, 0, 1))));
  return { t, screen: { awake, typed, ship, rows, chars }, shipAge: t >= SHIP_T ? t - SHIP_T : -1 };
}

// Confetti: deterministic bits that fly up from the top of the laptop on the beat the build passes.
function particles(t, n = 28) {
  const age = t - SHIP_T;
  if (age < 0 || age > 1.5) return [];
  const out = [];
  let s = 1234567;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 0; i < n; i++) {
    const vx = (rnd() - 0.5) * 520, vy = -(220 + rnd() * 330), w = (rnd() - 0.5) * 14;
    const size = 8 + rnd() * 10, kind = Math.floor(rnd() * 4);
    out.push({
      x: LAYOUT.laptop.screen.x + LAYOUT.laptop.screen.w / 2 + vx * age,
      y: LAYOUT.laptop.screen.y + vy * age + 520 * age * age,
      rot: w * age, size, kind, alpha: 1 - smooth(1.0, 1.5, age), i,
    });
  }
  return out;
}

// For styles that want to draw limbs as two-bone chains: [[from, to, width], ...] far side first.
function limbs(p) {
  const D = DIMS;
  const L = (a, b, w) => [a, b, w];
  const leg = (s) => [L(s.hip, s.knee, D.thighW), L(s.knee, s.ankle, D.shinW), L(s.ankle, s.toe, D.footH)];
  const arm = (s) => [L(s.shoulder, s.elbow, D.upperArmW), L(s.elbow, s.hand, D.foreArmW)];
  return { farLeg: leg(p.far), farArm: arm(p.far), torso: L(p.pelvis, p.neck, D.torsoW), nearLeg: leg(p.near), nearArm: arm(p.near) };
}

// Shared helpers for style code.
const util = { clamp, lerp, smooth, easeInOut };
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

return { W, H, FLOOR, T, BPM, BEAT, SHIP_T, LAYOUT, DIMS, SCREEN_LINES, bodyX, pose, story, particles, limbs, util, rng };
})();
const style = (() => {
// 06 Isometric Voxel: the whole scene is cubes in a true isometric view (30 degree axes, 12 unit cubes).
// The room (floor, walls, window, desk, laptop, plant, lamp) is built once as a cube set and cached as an image per
// size. The figure is voxelised from pose(t) on every call: each limb capsule, the torso, the head are filled with
// cubes, merged into one set (colour by body part) and drawn far-to-near with three shaded faces per cube.
const { W, H, LAYOUT, DIMS, pose, story, particles, util, rng } = rig;

const meta = { id: '06', slug: 'voxel', name: 'Isometric Voxel', tag: 'cubes', accent: '#ff9a3c' };

const { clamp, lerp } = util;
const S = 12;                         // cube edge in world units
const FA = 0.8660254;                 // cos 30
const FLOOR_Y = 800;

// ---- camera: true isometric. World X runs down-right, Z runs down-left, height runs up -----------------------
const XA = -132, XB = 1008, ZA = -108, ZB = 132, HWALL = 58 * S, SLAB = 3 * S;
const uMin = (XA - ZB) * FA, uMax = (XB - ZA) * FA;
const vTop = (XA + ZA) * 0.5 - HWALL, vBot = (XB + ZB) * 0.5 + SLAB;
const SC = Math.min(968 / (uMax - uMin), 968 / (vBot - vTop));
const CX = 500 - ((uMin + uMax) / 2) * SC, CY = 500 - ((vTop + vBot) / 2) * SC;
const EX = S * FA * SC, EY = S * 0.5 * SC, EH = S * SC;     // screen vectors of one cube edge along X, Z, height

// ---- colour helpers (colours are packed 0xRRGGBB integers) ----------------------------------------------------
const hex = (s) => parseInt(s.slice(1), 16);
const R = (c) => (c >> 16) & 255, G = (c) => (c >> 8) & 255, B = (c) => c & 255;
const pack = (r, g, b) => (clamp(Math.round(r), 0, 255) << 16) | (clamp(Math.round(g), 0, 255) << 8) | clamp(Math.round(b), 0, 255);
const mul = (c, f) => pack(R(c) * f, G(c) * f, B(c) * f);
const mix = (a, b, k) => pack(lerp(R(a), R(b), k), lerp(G(a), G(b), k), lerp(B(a), B(b), k));
const cssCache = new Map();
const css = (c) => { let s = cssCache.get(c); if (!s) { s = `rgb(${R(c)},${G(c)},${B(c)})`; cssCache.set(c, s); } return s; };
const hash = (i, j, k) => { let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(k, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const FT = 1.14, FL = 0.84, FR = 0.6;            // face shading: top light, left mid, right dark
const FE = [1.0, 0.94, 0.86];                    // emissive cubes barely shade

// palette: wall blue, wood floor (two tiles), desk wood, hoodie coral, jeans blue, sneaker cream + orange toe,
// skin, lamp orange, plant green, night sky navy, window cream, screen green.
const P = {
  wallHi: hex('#6f9bdc'), wallLo: hex('#4f78bd'), floorA: hex('#cf9f66'), floorB: hex('#b98450'), slab: hex('#7d5532'),
  deskTop: hex('#c08550'), desk: hex('#8f5c36'), hoodie: hex('#ff6b4a'), sleeve: hex('#f25a3b'), hem: hex('#d94a30'),
  jeans: hex('#26306e'), cuff: hex('#6f8fe0'), sole: hex('#f7f3ea'), upper: hex('#ebe7dd'), toe: hex('#ff9a3c'),
  skin: hex('#f2c3a0'), hair: hex('#2f1d16'), dark: hex('#1b1626'), phone: hex('#22252f'), cup: hex('#2dd4c4'),
  cream: hex('#efe3cb'), silver: hex('#c5ccd8'), silverDk: hex('#98a2b4'), pot: hex('#dc7a3c'), leaf: hex('#3fb35a'),
  green: hex('#17b26a'), white: 0xffffff,
};

// ---- cube set helpers -----------------------------------------------------------------------------------------
const key = (i, j, k) => ((i + 64) * 128 + (j + 16)) * 64 + (k + 32);
const colKey = (i, k) => (i + 64) * 64 + (k + 32);

// ---- the static room -----------------------------------------------------------------------------------------
const LAMP = { x: 930, h: 292, z: -60 };              // warm lamp on the desk
const lampTint = (c, x, h, z) => {
  const d2 = (x - LAMP.x) ** 2 + (h - LAMP.h) ** 2 + (z - LAMP.z) ** 2;
  const w = Math.exp(-d2 / (2 * 400 * 400));
  return pack(R(c) * (1 + 0.16 * w) + 40 * w, G(c) * (1 + 0.08 * w) + 18 * w, B(c) * (1 - 0.06 * w));
};

const WIN = { i0: 7, i1: 28, j0: 27, j1: 55 };
const DESK = { i0: 47, i1: 79, k0: -8, k1: 5 };
const LAPTOP = { bi0: 50, bi1: 69, bk0: -4, bk1: 3, si0: 52, si1: 67, sj0: 16, sj1: 28 };
const KW = -9;                                       // back wall cell row
const IW = -11;                                      // side wall cell column

let STATIC = null;
function buildStatic() {
  const M = new Map();
  const add = (i, j, k, c, e = 0) => { M.set(key(i, j, k), { i, j, k, c, e }); };
  const del = (i, j, k) => M.delete(key(i, j, k));
  // shadow footprint on the floor, shifted one cube to the left of each prop
  const inRect = (i, k, r) => i >= r.i0 - 1 && i <= r.i1 - 1 && k >= r.k0 && k <= r.k1;
  const plantRect = { i0: 71, i1: 75, k0: 7, k1: 10 };
  // floor slab, three cubes thick, checker tiles of 2 x 2 cubes
  for (let i = IW; i <= 83; i++) for (let k = KW; k <= 10; k++) for (let j = -3; j <= -1; j++) {
    let c;
    if (j < -1) c = P.slab;
    else {
      c = ((i >> 1) + (k >> 1)) & 1 ? P.floorA : P.floorB;
      const X = (i + 0.5) * S, Z = (k + 0.5) * S;
      if (inRect(i, k, DESK)) c = mul(c, 0.62);
      else if (inRect(i, k, plantRect)) c = mul(c, 0.72);
      // moonlight from the window, four panes, falls forward and slightly right
      const lz = (Z + 96);
      const xs = X - lz * 0.4;
      const pane = (xs > 98 && xs < 198) || (xs > 222 && xs < 336);
      if (pane && lz > 0 && lz < 330) c = mix(c, hex('#9fbaff'), 0.22 * (1 - lz / 330));
    }
    add(i, j, k, c);
  }
  // back wall and side wall: stripes of wainscot and wall colour
  const wallColour = (j, i, k) => (j < 13 ? P.wallLo : j === 13 ? mul(P.wallLo, 0.85) : P.wallHi);
  for (let i = IW; i <= 83; i++) for (let j = 0; j < 58; j++) add(i, j, KW, wallColour(j, i, KW));
  for (let k = KW + 1; k <= 10; k++) for (let j = 0; j < 58; j++) add(IW, j, k, wallColour(j, IW, k));
  // skirting
  for (let i = IW + 1; i <= 83; i++) add(i, 0, KW + 1, mul(P.wallLo, 0.7));
  for (let k = KW + 2; k <= 10; k++) add(IW + 1, 0, k, mul(P.wallLo, 0.7));

  // window: open the wall, frame it in cream, put a night city a few cubes behind
  for (let i = WIN.i0; i <= WIN.i1; i++) for (let j = WIN.j0; j <= WIN.j1; j++) {
    const ring = i === WIN.i0 || i === WIN.i1 || j === WIN.j0 || j === WIN.j1;
    const mull = i === 17 || i === 18 || j === 41;
    if (ring || mull) { add(i, j, KW, P.cream); if (ring) add(i, j, KW + 1, P.cream); else add(i, j, KW, mul(P.cream, 0.95)); } else del(i, j, KW);
  }
  for (let i = WIN.i0 - 1; i <= WIN.i1 + 1; i++) { add(i, WIN.j0 - 1, KW + 1, mul(P.cream, 0.92)); add(i, WIN.j0 - 1, KW + 2, mul(P.cream, 0.92)); }
  const sky = ['#07102c', '#0a1438', '#0d1a44', '#141f55', '#1f2662', '#2d2d70', '#403078'].map(hex);
  for (let i = 4; i <= 29; i++) for (let j = 22; j <= 55; j++) add(i, j, KW - 2, sky[clamp(Math.floor(((55 - j) / 34) * sky.length), 0, sky.length - 1)]);
  const rs = rng(31);
  for (let n = 0; n < 16; n++) add(5 + Math.floor(rs() * 23), 42 + Math.floor(rs() * 13), KW - 2, hex(rs() < 0.5 ? '#c9d6ff' : '#fff0b0'), 1);
  const rb = rng(8);
  const skyline = (kk, base, minH, maxH, col, lit, step) => {
    let i = 3;
    while (i < 30) {
      const bw = 2 + Math.floor(rb() * 3), bh = minH + Math.floor(rb() * (maxH - minH));
      for (let a = 0; a < bw; a++) for (let j = base; j < base + bh; j++) {
        const isWin = (j - base) % 2 === 1 && a % 2 === 0 && j < base + bh - 1 && rb() < 0.55;
        if (isWin && lit) add(i + a, j, kk, hex(rb() < 0.7 ? '#ffd36b' : '#7fe8ff'), 1); else add(i + a, j, kk, col);
      }
      i += bw + (step ? 0 : 0);
    }
  };
  skyline(KW - 2, 22, 8, 22, hex('#1c2158'), true);
  skyline(KW - 1, 22, 4, 14, hex('#10143a'), true);
  // moon: a disc of cubes with a shaded bite, in the top right pane
  for (let i = 18; i <= 27; i++) for (let j = 41; j <= 53; j++) {
    const d = (i - 22) ** 2 + (j - 47) ** 2;
    if (d <= 6.3) { const bite = (i - 23) ** 2 + (j - 48) ** 2 <= 4.2; add(i, j, KW - 1, bite ? hex('#dcd29a') : hex('#fff3bf'), 1); }
  }

  // clock disc on the wall: dark rim, cream face, four hour marks
  const cI = LAYOUT.clock.x, cH = FLOOR_Y - LAYOUT.clock.y;
  for (let i = 29; i <= 42; i++) for (let j = 48; j <= 62; j++) {

  const k = w / W;
  if (!STATIC) STATIC = buildStatic();
  const p = pose(t), s = story(t);
  ctx.save();
  ctx.scale(k, k);
  ctx.drawImage(background(w), 0, 0, W, H);
  ctx.lineJoin = 'round'; ctx.lineWidth = 0.9; ctx.strokeStyle = 'rgba(8,10,30,0.22)';

  const proj = (X, Y, Z) => [CX + (X - Z) * FA * SC, CY + (X + Z) * 0.5 * SC - Y * SC];
  const tile = (i, kk, y = 0) => { const [x, yy] = proj(i * S, y, kk * S); return [x, yy, x + EX, yy + EY, x + EX - EX, yy + EY + EY, x - EX, yy + EY]; };

  // the figure
  const F = voxelise(p, t);
  const items = [...F.values()];
  // soft shadow of the figure on the floor, thrown a little to the left
  const sh = new Set();
  for (const c of items) sh.add(colKey(c.i - Math.floor(c.j * 0.3), c.k));
  ctx.fillStyle = 'rgba(10,8,30,0.3)'; ctx.beginPath();
  for (const kk of sh) {
    if (STATIC.cols.has(kk)) continue;
    const i = Math.floor(kk / 64) - 64, kz = (kk % 64) - 32;
    const [a, b, c1, d, e, f, g1, h1] = tile(i, kz);
    ctx.moveTo(a, b - 0); ctx.lineTo(c1, d); ctx.lineTo(e, f); ctx.lineTo(g1, h1); ctx.closePath();
  }
  ctx.fill();
  // ship: a ring of light runs across the floor tiles
  const age = t - 2.8;
  if (age > 0 && age < 0.8) {
    const e = age / 0.8, rad = 40 + e * 520;
    ctx.fillStyle = `rgba(255,236,170,${0.34 * (1 - e)})`; ctx.beginPath();
    const ci = 60, ck = -1;
    for (let i = IW + 1; i <= 83; i++) for (let kk = KW + 1; kk <= 10; kk++) {
      if (STATIC.cols.has(colKey(i, kk))) continue;
      const d = Math.hypot((i - ci) * S, (kk - ck) * S);
      if (Math.abs(d - rad) < 22) { const [a, b, c1, d1, e1, f, g1, h1] = tile(i, kk); ctx.moveTo(a, b); ctx.lineTo(c1, d1); ctx.lineTo(e1, f); ctx.lineTo(g1, h1); ctx.closePath(); }
    }
    ctx.fill();
  }

  // clock hands: a few cubes in front of the clock face
  const cc = LAYOUT.clock, chh = FLOOR_Y - cc.y;
  const hand = (deg, len, col) => { const a = deg * Math.PI / 180; for (let q = 0; q * 5 <= len; q++) cube(ctx, cc.x + Math.sin(a) * q * 5 - 2.5, chh + Math.cos(a) * q * 5 - 2.5, (KW + 2) * S, 5, col, 0, true, true, true); };
  hand(305 + t * 0.5, 22, hex('#2b2f4a'));
  hand(60 + t * 6, 32, hex('#2b2f4a'));
  hand(Math.floor(t / 0.4) * 30, 34, hex('#e5483a'));

  drawDisplay(ctx, displayGrid(t, s));

  // figure cubes, far to near
  items.sort((a, b) => (a.i + a.j + a.k) - (b.i + b.j + b.k));
  const has = (i, j, kk) => F.has(key(i, j, kk)) || STATIC.M.has(key(i, j, kk));
  const lit = (c, x, hh, z) => lampTint(c, x, hh, z);
  for (const c of items) {
    const fT = !has(c.i, c.j + 1, c.k), fL = !has(c.i, c.j, c.k + 1), fR = !has(c.i + 1, c.j, c.k);
    if (fT || fL || fR) cube(ctx, c.i * S, c.j * S, c.k * S, S, lit(c.c, (c.i + 0.5) * S, (c.j + 0.5) * S, (c.k + 0.5) * S), 0, fT, fL, fR);
  }

  // confetti: small floating cubes
  const cols = ['#ff4f6d', '#ffd23f', '#3ddc97', '#4cc9f0', '#ffffff'].map(hex);
  const conf = particles(t, 48).map((q) => ({ q, X: q.x, Y: FLOOR_Y - q.y, Z: -10 + (((q.i * 7) % 9) - 4) * 14 })).sort((a, b) => (a.X + a.Y + a.Z) - (b.X + b.Y + b.Z));
  for (const { q, X, Y, Z } of conf) {
    ctx.globalAlpha = q.alpha;
    const sz = 7 + q.size * 0.5;
    cube(ctx, X, Y, Z, sz, cols[q.i % 5], 1, true, true, true);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

return { meta, render };
})();

const LOOP = rig.T + 0.9;                       // a short hold on the last frame before it starts again
function play(canvas, style) {
  const c = canvas.getContext('2d');
  const t0 = performance.now();
  (function frame(now) {
    const t = Math.min(Math.max(0, ((now - t0) / 1000) % LOOP), rig.T);   // the first rAF timestamp can be a hair before t0
    style.render(c, t, canvas.width, canvas.height);
    requestAnimationFrame(frame);
  })(t0);
}
play(document.getElementById('c'), style);
</script>
</html>
