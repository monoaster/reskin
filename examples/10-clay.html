<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

<main><canvas id="c" width="1000" height="1000"></canvas>
<p><span>reskin / 10-clay</span><span>prompt: prompts/10-clay.md</span></p></main>
<script>
const rig = (() => {
// reskin rig: one character, one scene, one 3.2 second walk. Every style draws from this.
//
// World: a 1000 x 1000 square, y points down, the floor is y = 800.
// The beat is 150 bpm (0.4 s). Footfalls land on the beat, the build passes on beat 7 (t = 2.8).
//
//   0.0 - 2.0   walks in from the left, slows to a stop at x = 490
//   2.0 - 2.4   raises the near hand to the laptop keyboard
//   2.4 - 2.8   types (three key taps: 2.4, 2.6, 2.8), code rows fill the screen
//   2.8         the build passes: the screen flips, confetti, a hop
//   2.8 - 3.2   fist pump, then the clip ends
//
// Everything here is a pure function of t. No randomness, no clock: call it with any t, in any order.

const W = 1000;
const H = 1000;
const FLOOR = 800;
const T = 3.2;            // seconds per style
const BPM = 150;
const BEAT = 0.4;
const SHIP_T = 2.8;       // the moment the build passes

const LAYOUT = {
  floor: FLOOR,
  desk:   { x: 560, y: 610, w: 400, h: 190 },                 // table top is y = 610
  laptop: { base: { x: 600, y: 598, w: 230, h: 12 },          // keyboard slab, sits on the desk
            screen: { x: 615, y: 440, w: 200, h: 158 } },      // facing the viewer
  hand:   { x: 650, y: 594 },                                  // where the near hand lands on the keys
  window: { x: 80, y: 130, w: 260, h: 350 },
  clock:  { x: 430, y: 170, r: 34 },
  plant:  { x: 880, y: 800 },
};

const DIMS = {
  thigh: 100, shin: 98, upperArm: 92, foreArm: 86,
  torso: 124, neck: 16, headR: 38,
  thighW: 24, shinW: 19, upperArmW: 17, foreArmW: 15, torsoW: 58, footLen: 40, footH: 14,
  depth: 26,   // z offset of the near / far limbs, for 3D styles
};

const SCREEN_LINES = [
  'const build = await ship()',
  'if (build.ok) {',
  '  deploy(build)',
  '}',
  'tests: 42 passed',
  'status: SHIPPED',
];

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, v) => { const k = clamp((v - a) / (b - a)); return k * k * (3 - 2 * k); };
const easeInOut = (k) => k * k * (3 - 2 * k);

// ---- where the body is --------------------------------------------------------------------
const X0 = -40, X1 = 490, CRUISE_END = 1.5, STOP = 2.0;
const V = (X1 - X0) / (CRUISE_END + (STOP - CRUISE_END) / 2);   // px per second while cruising

function bodyX(t) {
  if (t <= CRUISE_END) return X0 + V * Math.max(t, -1);
  if (t >= STOP) return X1;
  const u = (t - CRUISE_END) / (STOP - CRUISE_END);               // linear slow-down to a stop
  return X0 + V * CRUISE_END + V * (STOP - CRUISE_END) * (u - u * u / 2);
}

// Feet plant in world space on the beat, so nothing slides. Each foot has a 0.8 s cycle:
// 0 - 0.6 planted, 0.6 - 1 swinging to the next planting spot, which is under the pelvis at mid-stance.
function footTrack(t, offset, side) {
  const P = 0.8, STANCE = 0.6;
  const n = Math.floor((t - offset) / P);
  const u = (t - offset) / P - n;
  const land = (k) => bodyX(offset + k * P + 0.24) + side * 6;
  const L0 = land(n), L1 = land(n + 1);
  if (u < STANCE) return { x: L0, lift: 0, swing: -1, u };
  const s = (u - STANCE) / (1 - STANCE);
  return { x: lerp(L0, L1, easeInOut(s)), lift: Math.sin(Math.PI * s), swing: s, u };
}

function ik2(ax, ay, tx, ty, l1, l2, sgn) {
  let dx = tx - ax, dy = ty - ay;
  let d = Math.hypot(dx, dy);
  const max = l1 + l2 - 0.5;
  if (d > max) { tx = ax + dx * max / d; ty = ay + dy * max / d; dx = tx - ax; dy = ty - ay; d = max; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = ax + a * dx / d, my = ay + a * dy / d;
  return { x: mx + sgn * h * (-dy / d), y: my + sgn * h * (dx / d), tx, ty };
}

// ---- the pose -----------------------------------------------------------------------------
// Returns joints as {x, y, z}. z is -1 (far side), 0 (spine) or +1 (near side) so 3D styles can push limbs apart.
function pose(t) {
  t = clamp(t, 0, T);
  const D = DIMS;
  const walk = 1 - smooth(1.55, 2.05, t);             // 1 while walking, 0 once stopped
  const reach = smooth(2.0, 2.45, t);                 // near hand goes to the keyboard
  const celebrate = smooth(2.82, 3.0, t);             // fist pump
  const tapPulse = (t0) => { const k = (t - t0) / 0.12; return k > 0 && k < 1 ? Math.sin(Math.PI * k) : 0; };
  const tap = Math.max(tapPulse(2.4), tapPulse(2.6), tapPulse(2.8));
  const hopK = clamp((t - 2.84) / 0.34);
  const hop = 34 * Math.sin(Math.PI * hopK);

  const px = bodyX(t) + 0;
  const bob = walk * 7 * (0.5 + 0.5 * Math.cos(2 * Math.PI * t / BEAT));
  const standH = 196;
  const py = FLOOR - standH + bob - hop;
  const lean = 0.05 * walk + 0.16 * reach * (1 - celebrate * 0.7) - 0.04 * celebrate;

  const sx = px + Math.sin(lean) * D.torso * 0.96;
  const sy = py - Math.cos(lean) * D.torso * 0.96;
  const neck = { x: px + Math.sin(lean) * D.torso, y: py - Math.cos(lean) * D.torso, z: 0 };
  const headTilt = lean + 0.1 * reach - 0.1 * celebrate;
  const head = { x: neck.x + Math.sin(headTilt) * (D.neck + D.headR), y: neck.y - Math.cos(headTilt) * (D.neck + D.headR), z: 0, r: D.headR, angle: headTilt };

  // legs
  const fN = footTrack(t, 0.0, +1);       // near foot lands on t = 0, 0.8, 1.6 ...
  const fF = footTrack(t, 0.4, -1);       // far foot lands on t = 0.4, 1.2, 2.0 ...
  const settle = 1 - walk;
  const stand = (side) => px + side * 16;
  const legJoints = (f, side, z) => {
    const fx = lerp(f.x, stand(side) + 0, settle);
    const lift = f.lift * 46 * walk + hop * 0.9;
    const ay = FLOOR - 12 - lift;
    const hip = { x: px + side * 4, y: py, z };
    const k = ik2(hip.x, hip.y, fx, ay, D.thigh, D.shin, -1);
    const pitch = f.swing < 0 ? 0 : lerp(0.55, -0.3, f.swing);
    const pitchAir = hop > 2 ? 0.25 : pitch;
    const toe = { x: k.tx + Math.cos(pitchAir) * D.footLen, y: k.ty + 12 + Math.sin(pitchAir) * D.footLen * 0.6 - (hop > 2 ? 0 : 0), z };
    if (f.swing < 0 && hop < 2) toe.y = FLOOR;
    return { hip, knee: { x: k.x, y: k.y, z }, ankle: { x: k.tx, y: k.ty, z }, toe };
  };
  const legN = legJoints(fN, +1, +1);
  const legF = legJoints(fF, -1, -1);

  // arms
  const swingA = 0.62 * walk;
  const thN = -swingA * Math.cos(2 * Math.PI * t / (BEAT * 2));
  const thF = +swingA * Math.cos(2 * Math.PI * t / (BEAT * 2));
  const armLen = 150;
  const shoulderN = { x: sx + 3, y: sy, z: +1 }, shoulderF = { x: sx - 3, y: sy, z: -1 };
  const hangN = { x: shoulderN.x + Math.sin(thN + 0.05) * armLen, y: shoulderN.y + Math.cos(thN + 0.05) * armLen };
  const hangF = { x: shoulderF.x + Math.sin(thF + 0.05) * armLen, y: shoulderF.y + Math.cos(thF + 0.05) * armLen };
  const keys = { x: LAYOUT.hand.x, y: LAYOUT.hand.y - tap * 9 };
  const up = { x: shoulderN.x + 52, y: shoulderN.y - 150 - Math.sin(t * 40) * 3 * celebrate };
  let tgtN = { x: lerp(hangN.x, keys.x, reach), y: lerp(hangN.y, keys.y, reach) };
  tgtN = { x: lerp(tgtN.x, up.x, celebrate), y: lerp(tgtN.y, up.y, celebrate) };
  const tgtF = { x: hangF.x + (hop > 0 ? -18 : 0), y: hangF.y - hop * 0.4 };
  const aN = ik2(shoulderN.x, shoulderN.y, tgtN.x, tgtN.y, D.upperArm, D.foreArm, +1);
  const aF = ik2(shoulderF.x, shoulderF.y, tgtF.x, tgtF.y, D.upperArm, D.foreArm, +1);

  return {
    t, walk, reach, celebrate, tap, hop, lean, facing: 1,
    pelvis: { x: px, y: py, z: 0 }, chest: { x: lerp(px, sx, 0.55), y: lerp(py, sy, 0.55), z: 0 }, neck, head,
    near: { hip: legN.hip, knee: legN.knee, ankle: legN.ankle, toe: legN.toe, shoulder: shoulderN, elbow: { x: aN.x, y: aN.y, z: +1 }, hand: { x: aN.tx, y: aN.ty, z: +1 } },
    far:  { hip: legF.hip, knee: legF.knee, ankle: legF.ankle, toe: legF.toe, shoulder: shoulderF, elbow: { x: aF.x, y: aF.y, z: -1 }, hand: { x: aF.tx, y: aF.ty, z: -1 } },
  };
}

// ---- the story around the body -----------------------------------------------------------------
// screen.awake: laptop wakes while the hand lifts. screen.typed: 0..1 of the code on screen.
// screen.ship: 0 -> 1 across the flip to the green "SHIPPED" state. shipAge: seconds since it passed (or -1).
function story(t) {
  const typed = smooth(2.38, 2.8, t);
  const ship = smooth(SHIP_T, SHIP_T + 0.12, t);
  const awake = smooth(1.7, 2.0, t);
  const rows = [0.55, 0.8, 0.45, 0.2, 0.7, 0.35].map((w, i) => ({
    w, indent: [0, 0, 0.12, 0, 0, 0.12][i],
    len: clamp(typed * 6.4 - i, 0, 1),
  }));
  const chars = SCREEN_LINES.map((s, i) => s.slice(0, Math.round(s.length * clamp(typed * 6.4 - i, 0, 1))));
  return { t, screen: { awake, typed, ship, rows, chars }, shipAge: t >= SHIP_T ? t - SHIP_T : -1 };
}

// Confetti: deterministic bits that fly up from the top of the laptop on the beat the build passes.
function particles(t, n = 28) {
  const age = t - SHIP_T;
  if (age < 0 || age > 1.5) return [];
  const out = [];
  let s = 1234567;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 0; i < n; i++) {
    const vx = (rnd() - 0.5) * 520, vy = -(220 + rnd() * 330), w = (rnd() - 0.5) * 14;
    const size = 8 + rnd() * 10, kind = Math.floor(rnd() * 4);
    out.push({
      x: LAYOUT.laptop.screen.x + LAYOUT.laptop.screen.w / 2 + vx * age,
      y: LAYOUT.laptop.screen.y + vy * age + 520 * age * age,
      rot: w * age, size, kind, alpha: 1 - smooth(1.0, 1.5, age), i,
    });
  }
  return out;
}

// For styles that want to draw limbs as two-bone chains: [[from, to, width], ...] far side first.
function limbs(p) {
  const D = DIMS;
  const L = (a, b, w) => [a, b, w];
  const leg = (s) => [L(s.hip, s.knee, D.thighW), L(s.knee, s.ankle, D.shinW), L(s.ankle, s.toe, D.footH)];
  const arm = (s) => [L(s.shoulder, s.elbow, D.upperArmW), L(s.elbow, s.hand, D.foreArmW)];
  return { farLeg: leg(p.far), farArm: arm(p.far), torso: L(p.pelvis, p.neck, D.torsoW), nearLeg: leg(p.near), nearArm: arm(p.near) };
}

// Shared helpers for style code.
const util = { clamp, lerp, smooth, easeInOut };
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

return { W, H, FLOOR, T, BPM, BEAT, SHIP_T, LAYOUT, DIMS, SCREEN_LINES, bodyX, pose, story, particles, limbs, util, rng };
})();
const style = (() => {
// 10 clay: Clay Stop-Motion. A plasticine animation shot on threes.
// Time is quantised to 1/8 s (held frames), on a grid that has t = 2.8 on it so the build passes on a held frame.
// Every object is a lumpy blob: radial gradient lit from the top left, dark rim, soft crescent shadow, a specular
// dot and a fingerprint/dent texture (soft-light, per size, cached). On every step each object gets a tiny seeded
// offset, rotation and squash/stretch of 1 to 3 percent, which is the handmade jitter.
const { W, H, LAYOUT, pose, story, particles, util } = rig;

const meta = { id: '10', slug: 'clay', name: 'Clay Stop-Motion', tag: 'on threes', accent: '#f08a2d' };

const { clamp, lerp, smooth } = util;
const TAU = Math.PI * 2;
const STEP = 0.125, T0 = 0.05;

const P = {
  wall: '#6fa8a6', table: '#dcbc86', orange: '#f08a2d', blue: '#3d62ad', navy: '#1d2d57', skin: '#f1b48f', brown: '#a6683c',
  hair: '#4a2c20', yellow: '#f5cf3c', cream: '#efe4cb', green: '#3fbf6a', plant: '#5aae4a', pot: '#d8602a', red: '#e0503a', ink: '#1a1210',
};

let c = null, K = 1, SK = 0, PAT = null;     // context, pixels per world unit, step index, texture pattern

// ---- pure helpers ----------------------------------------------------------------------------------------------
function hash(a, b = 0, d = 0) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x1234567, 0x165667b1) ^ Math.imul((d | 0) + 0x7654321, 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d); h = Math.imul(h ^ (h >>> 12), 0x297a2d39); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
const sidMemo = new Map();
function sid(s) {
  if (typeof s === 'number') return s | 0;
  let v = sidMemo.get(s);
  if (v === undefined) { v = 5381; for (let i = 0; i < s.length; i++) v = (Math.imul(v, 33) ^ s.charCodeAt(i)) | 0; sidMemo.set(s, v); }
  return v;
}
function noise(seed, x) {
  const i = Math.floor(x), f = x - i, a = hash(seed, i), b = hash(seed, i + 1), k = f * f * (3 - 2 * f);
  return (a + (b - a) * k) * 2 - 1;
}
function lcg(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const rgbMemo = new Map(), shadeMemo = new Map();
function rgb(h) { let v = rgbMemo.get(h); if (!v) { v = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; rgbMemo.set(h, v); } return v; }
const hx = (n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
function shade(h, k) {          // k > 0 lighter (warm white), k < 0 darker (warm brown-black); always returns #rrggbb
  const key = h + k; let v = shadeMemo.get(key);
  if (!v) { const a = rgb(h), b = k >= 0 ? [255, 243, 224] : [43, 14, 6], t = Math.abs(k); v = '#' + hx(a[0] + (b[0] - a[0]) * t) + hx(a[1] + (b[1] - a[1]) * t) + hx(a[2] + (b[2] - a[2]) * t); shadeMemo.set(key, v); }
  return v;
}

// ---- geometry ----------------------------------------------------------------------------------------------------
function chaikin(pts, it) {
  for (let k = 0; k < it; k++) {
    const out = [], n = pts.length;
    for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
    pts = out;
  }
  return pts;
}
function catmull(Pp, per = 6) {
  const out = [];
  for (let i = 0; i < Pp.length - 1; i++) {
    const p0 = Pp[Math.max(0, i - 1)], p1 = Pp[i], p2 = Pp[i + 1], p3 = Pp[Math.min(Pp.length - 1, i + 2)];
    for (let j = 0; j < per; j++) {
      const u = j / per, u2 = u * u, u3 = u2 * u;
      out.push([0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)]);
    }
  }
  out.push(Pp[Pp.length - 1]);
  return out;
}
function circlePts(cx, cy, rx, ry, n = 24, rot = 0) {
  const out = [], cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < n; i++) { const a = (i / n) * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; out.push([cx + x * cr - y * sr, cy + x * sr + y * cr]); }
  return out;
}
function rrect(x, y, w, h, r) {
  const pts = [];
  for (const [cx, cy, a0] of [[x + w - r, y + r, -90], [x + w - r, y + h - r, 0], [x + r, y + h - r, 90], [x + r, y + r, 180]])
    for (let i = 0; i <= 5; i++) { const a = ((a0 + i * 18) * Math.PI) / 180; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
function capPoly(a, b, ra, rb) {      // a rounded capsule between two points
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, tx = dx / l, ty = dy / l, nx = -ty, ny = tx, pts = [];
  for (let k = 0; k <= 8; k++) { const f = (k / 8) * Math.PI; pts.push([b[0] + (nx * Math.cos(f) + tx * Math.sin(f)) * rb, b[1] + (ny * Math.cos(f) + ty * Math.sin(f)) * rb]); }
  for (let k = 0; k <= 8; k++) { const f = (k / 8) * Math.PI; pts.push([a[0] + (-nx * Math.cos(f) - tx * Math.sin(f)) * ra, a[1] + (-ny * Math.cos(f) - ty * Math.sin(f)) * ra]); }
  return pts;
}
function dense(poly, maxLen) {
  const out = [], n = poly.length;
  for (let i = 0; i < n; i++) {
    const a = poly[i], b = poly[(i + 1) % n], d = Math.hypot(b[0] - a[0], b[1] - a[1]), m = Math.max(1, Math.ceil(d / maxLen));
    for (let k = 0; k < m; k++) out.push([a[0] + (b[0] - a[0]) * k / m, a[1] + (b[1] - a[1]) * k / m]);
  }
  return out;
}
// handmade imperfection: lumpy outline plus a per-step offset, small rotation and 1-3% squash/stretch
function place(poly, id, o = {}) {
  const idn = sid(id), amp = o.amp ?? 1.1, jm = o.j ?? 1;
  let Q = dense(poly, o.sp ?? 9);
  let cx = 0, cy = 0; for (const p of Q) { cx += p[0]; cy += p[1]; } cx /= Q.length; cy /= Q.length;
  const n = Q.length, out = new Array(n);
  const ang = hash(idn, SK, 1) * TAU, e = (0.01 + 0.02 * hash(idn, SK, 2)) * jm, rot = (hash(idn, SK, 3) - 0.5) * 0.025 * jm;
  const jx = (hash(idn, SK, 4) - 0.5) * 3.2 * jm + (o.dx ?? 0), jy = (hash(idn, SK, 5) - 0.5) * 3.2 * jm + (o.dy ?? 0);
  const ca = Math.cos(ang), sa = Math.sin(ang), cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < n; i++) {
    const p = Q[i], a = Q[(i + n - 1) % n], b = Q[(i + 1) % n];
    let nx = b[1] - a[1], ny = -(b[0] - a[0]); const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    if (nx * (p[0] - cx) + ny * (p[1] - cy) < 0) { nx = -nx; ny = -ny; }
    const off = amp * (0.7 * noise(idn, i * 0.33) + 0.3 * noise(idn + SK * 7 + 1, i * 0.33));
    let x = p[0] + nx * off - cx, y = p[1] + ny * off - cy;
    // squash/stretch along a random axis, volume kept roughly constant
    const u = x * ca + y * sa, v = -x * sa + y * ca, uu = u * (1 + e), vv = v * (1 - e * 0.8);
    x = uu * ca - vv * sa; y = uu * sa + vv * ca;
    out[i] = [cx + x * cr - y * sr + jx, cy + x * sr + y * cr + jy];
  }
  return out;
}

// ---- texture, cached per size ----------------------------------------------------------------------------------------
const texCache = new Map(), bgCache = new Map();
function mk(w, h = w) {
  if (typeof OffscreenCanvas !== 'undefined') return new OffscreenCanvas(w, h);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv;
}
function texFor(k) {
  const key = Math.round(k * 1000);
  let t = texCache.get(key);
  if (t) return t;

let tapNow = 0;

// ---- the character ------------------------------------------------------------------------------------------------------------------
const OR = P.orange, DOR = shade(P.orange, -0.2), JEAN = P.blue, DJEAN = shade(P.blue, -0.2);
function shoePoly(leg) {
  const A = [leg.ankle.x, leg.ankle.y + 12], B = [leg.toe.x, leg.toe.y];
  const len = Math.hypot(B[0] - A[0], B[1] - A[1]) || 40, sx = (B[0] - A[0]) / len, sy = (B[1] - A[1]) / len, nx = sy, ny = -sx;

}
function legPart(leg, far, id) {
  const hip = [leg.hip.x, leg.hip.y], kn = [leg.knee.x, leg.knee.y], an = [leg.ankle.x, leg.ankle.y];
  const col = far ? DJEAN : JEAN;
  clay([place(capPoly(hip, kn, 19, 16), id + 'th', { amp: 0.9 })], col, { id: id + 'th', sh: 0.7 });
  clay([place(capPoly(kn, an, 15.5, 12.5), id + 'sh', { amp: 0.9 })], col, { id: id + 'sh', sh: 0.7 });
  groove([[kn[0] - 7, kn[1] - 2], [kn[0] + 5, kn[1] + 3]], col, 2.2);
  const sh = shoePoly(leg);
  clay([place(sh.body, id + 'shoe', { amp: 0.8 })], far ? shade(P.cream, -0.12) : P.cream, { id: id + 'shoe', sh: 0.7 });
  clay([place(sh.sole, id + 'sole', { amp: 0.4, j: 0.5 })], '#4a3a30', { id: id + 'sole', sh: 0.4, spec: false });
  groove([sh.T(10, 25), sh.T(30, 17)], P.cream, 2); groove([sh.T(2, 23), sh.T(20, 19)], P.cream, 2);
  clay([place(circlePts(...sh.T(sh.len - 8, 15), 7, 5.5, 10), id + 'cap', { amp: 0.3, j: 0.6 })], P.red, { id: id + 'cap', sh: 0.3, spec: false });
}
function handPart(h, fist, far, id) {
  if (fist) {
    clay([place(circlePts(h.x, h.y, 15, 14, 18), id, { amp: 0.7 })], P.skin, { id, sh: 0.6 });
    for (let i = 0; i < 3; i++) groove([[h.x + 2 + i * 4.5, h.y - 11], [h.x + 5 + i * 4, h.y + 3]], P.skin, 1.8);
  } else clay([place(circlePts(h.x + 3, h.y + 1, 12.5, 11, 16), id, { amp: 0.7 })], far ? shade(P.skin, -0.1) : P.skin, { id, sh: 0.6 });
}
function armPart(arm, far, id) {
  const sh = [arm.shoulder.x, arm.shoulder.y], el = [arm.elbow.x, arm.elbow.y], h = [arm.hand.x, arm.hand.y];
  const dx = h[0] - el[0], dy = h[1] - el[1], L = Math.hypot(dx, dy) || 1, wr = [h[0] - dx / L * 12, h[1] - dy / L * 12];

  clay([place(capPoly(el, wr, 13, 11), id + 'f', { amp: 0.8 })], col, { id: id + 'f', sh: 0.7 });

  clay([place(capPoly([wr[0] + nx * 8, wr[1] + ny * 8], [wr[0] - nx * 8, wr[1] - ny * 8], 5.5, 5.5), id + 'cuff', { amp: 0.4, j: 0.6 })], shade(col, -0.12), { id: id + 'cuff', sh: 0.4, spec: false });
}
function drawHead(p, sqx, sqy, s) {
  const h = p.head, th = h.angle, cs = Math.cos(th), sn = Math.sin(th), R = h.r;
  const T = (x, y) => [h.x + x * cs - y * sn, h.y + x * sn + y * cs];

  clay([place(circlePts(h.x, h.y, R * sqx, R * sqy, 34, th), 'head', { amp: 0.9 })], P.skin, { id: 'head', sh: 0.9 });
  clay([place(circlePts(...T(-14, 8), 7, 9, 14, th), 'ear', { amp: 0.4, j: 0.6 })], shade(P.skin, -0.08), { id: 'ear', sh: 0.4, spec: false });

  for (let i = 0; i < 3; i++) clay([place(circlePts(...T(-12 + i * 15, -R + 1), 7, 6, 10), 'curl' + i, { amp: 0.4, j: 1 })], P.hair, { id: 'curl' + i, sh: 0.3, spec: false });

  clay([place(circlePts(...T(R - 3, 8), 6.5, 6, 12), 'nose', { amp: 0.3, j: 0.6 })], shade(P.skin, -0.14), { id: 'nose', sh: 0.5 });

    clay([place(circlePts(e[0], e[1], 4.2, 4.2 * ey, 12), id, { amp: 0.1, j: 0.3 })], P.ink, { id, shadow: false, tex: false, rim: 0.2 });

  clay([place(chaikin(ctrl, 3), 'hoodie', { amp: 1.4, sp: 12 })], OR, { id: 'hoodie', sh: 1 });

  groove(catmull([TF(54, 37), TF(38, 24), TF(24, 22), TF(12, 38)], 5), OR, 2.8);
  groove([TF(62, -24), TF(68, -8)], OR, 2.2);

  // drawstrings
  groove(catmull([TF(114, 14), TF(100, 15), TF(86, 10)], 5), OR, 2.4); bead(...TF(84, 10), 3, P.cream);
  // headphones: a thin rolled coil round the neck and a ball cup on the chest
  clay([place(capPoly(TF(118, 22), TF(134, 14), 4.2, 4.2), 'hp1', { amp: 0.3, j: 0.6 }), place(capPoly(TF(134, 14), TF(140, -6), 4.2, 4.2), 'hp2', { amp: 0.3, j: 0.6 }), place(capPoly(TF(140, -6), TF(130, -26), 4.2, 4.2), 'hp3', { amp: 0.3, j: 0.6 })], P.yellow, { id: 'hp', sh: 0.5, spec: false });

function drawConfetti(tq) {
  const cols = [P.orange, P.yellow, P.blue, P.green, P.cream, P.red], now = particles(tq), next = particles(tq + 0.03);
  now.forEach((q, i) => {
    const nx = next[i];
    let vx = 0, vy = 0; if (nx) { vx = nx.x - q.x; vy = nx.y - q.y; }
    const sp = Math.hypot(vx, vy), ang = Math.atan2(vy, vx), st = 1 + clamp(sp / 40, 0, 0.18), r = q.size * 1.15, col = cols[q.i % cols.length];

    else if (q.kind === 1) poly = circlePts(q.x, q.y, r * 1.2, r * 0.8, 12, q.rot * 3 + q.i);

}

// ---- main ---------------------------------------------------------------------------------------------------------------------------------
function render(ctx, t, w, h) {
  K = w / W; c = ctx;
  const k = Math.floor((clamp(t, 0, 3.2) - T0) / STEP + 1e-6), tq = Math.max(0, T0 + k * STEP);
  SK = k;

})();

const LOOP = rig.T + 0.9;                       // a short hold on the last frame before it starts again
function play(canvas, style) {
  const c = canvas.getContext('2d');
  const t0 = performance.now();
  (function frame(now) {
    const t = Math.min(Math.max(0, ((now - t0) / 1000) % LOOP), rig.T);   // the first rAF timestamp can be a hair before t0
    style.render(c, t, canvas.width, canvas.height);
    requestAnimationFrame(frame);
  })(t0);
}
play(document.getElementById('c'), style);
