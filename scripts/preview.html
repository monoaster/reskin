<!doctype html>
<meta charset="utf-8">
<title>reskin preview</title>
<style>
  html, body { margin: 0; background: #222; }
  #sheet { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
  figure { margin: 0; position: relative; }
  figcaption { position: absolute; left: 6px; top: 4px; font: 600 14px ui-monospace, monospace; color: #fff; background: #0008; padding: 1px 5px; border-radius: 3px; }
  canvas { display: block; }
</style>
<div id="sheet"></div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const style = q.get('style') || '00-skeleton';
  const size = +(q.get('size') || 360);
  const times = (q.get('times') || '0.2,0.6,1.0,1.4,1.8,2.2,2.5,2.9,3.15').split(',').map(Number);
  const mod = await import(`../src/styles/${style}.js`);
  const sheet = document.getElementById('sheet');
  for (const t of times) {
    const f = document.createElement('figure'), c = document.createElement('canvas');
    c.width = c.height = size;
    const cap = document.createElement('figcaption'); cap.textContent = `t=${t}`;
    f.append(c, cap); sheet.append(f);
    try { mod.render(c.getContext('2d'), t, size, size); } catch (e) { console.error(e); cap.textContent += ' ERROR ' + e.message; }
  }
  await document.fonts.ready;
  window.__done = true;
</script>
